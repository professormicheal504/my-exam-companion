        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color, #f5f7fa);
            color: #111;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--surface-color, #ffffff);
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 32px;
            border-bottom: 1px solid #e5e7eb;
            background: var(--surface-color, #ffffff);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            color: #666;
            cursor: pointer;
            display: flex;
            align-items: center;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: #2563eb;
        }

        .back-btn svg { 
            width: 20px; 
            height: 20px; 
            fill: currentColor;
            margin-right: 8px;
        }

        /* ── Page Content ── */
        .content {
            flex: 1;
            padding: 40px 32px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
        }

        /* ── Left Column: Thumbnail & Fields ── */
        .left-column {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        /* ── Thumbnail ── */
        .thumbnail-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #f2f2f2;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
            border: 2px solid #e5e7eb;
        }

        .thumbnail-box:hover { 
            border-color: #2563eb;
            background: #eef5ff;
        }

        .thumbnail-box input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        .thumbnail-box img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            display: none;
        }

        .thumbnail-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            color: #999;
        }

        .thumb-plus {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2563eb;
        }

        .thumb-plus svg { width: 40px; height: 40px; fill: currentColor; }

        .thumb-label {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        .thumbnail-box.has-image .thumbnail-placeholder { display: none; }
        .thumbnail-box.has-image img { display: block; }

        /* ── Right Column: Info ── */
        .right-column {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* ── Field ── */
        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field-label {
            font-size: 12px;
            color: #999;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .field-value {
            font-size: 18px;
            font-weight: 700;
            color: #111;
            line-height: 1.5;
        }

        /* ── Divider ── */
        .divider {
            width: 100%;
            height: 1px;
            background: #e5e7eb;
        }

        /* ── Topic input ── */
        .topic-input {
            border: none;
            outline: none;
            font-size: 14px;
            color: #111;
            font-family: inherit;
            width: 100%;
            padding: 0;
            background: transparent;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 8px;
            transition: border-color 0.2s;
        }

        .topic-input:focus {
            border-bottom-color: #2563eb;
        }

        .topic-input::placeholder { color: #ccc; font-weight: 400; }

        /* Tags row */
        .tags-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
            min-height: 28px;
        }

        .tag-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: #f0f4ff;
            border: 1px solid #d1dff7;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            color: #2563eb;
            cursor: default;
        }

        .tag-remove {
            width: 14px;
            height: 14px;
            color: #2563eb;
            cursor: pointer;
            display: flex;
            align-items: center;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .tag-remove:hover {
            opacity: 1;
        }

        .tag-remove svg { width: 14px; height: 14px; fill: currentColor; }

        /* Category chips */
        .category-section { 
            display: flex; 
            flex-direction: column; 
            gap: 12px;
        }

        .category-label { 
            font-size: 12px; 
            color: #999; 
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chips-wrap { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px;
        }

        .chip {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1.5px solid #d1dff7;
            font-size: 13px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            transition: all 0.15s;
            background: #ffffff;
        }

        .chip:hover { 
            border-color: #2563eb; 
            color: #2563eb;
            background: #f0f4ff;
        }

        .chip.selected { 
            background: #2563eb; 
            color: #fff; 
            border-color: #2563eb; 
        }

        /* ── Image Selector Modal ── */
        .modal {
            position: fixed; 
            inset: 0; 
            z-index: 1000;
            display: none; 
            align-items: center; 
            justify-content: center;
            padding: 20px;
            background: rgba(0,0,0,0.5);
        }

        .modal.open { display: flex; }

        .modal-overlay { 
            position: absolute; 
            inset: 0; 
        }

        .modal-content {
            position: relative; 
            background: var(--surface-color, #ffffff); 
            border-radius: 12px;
            width: 100%; 
            max-width: 450px; 
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            z-index: 10;
        }

        .modal-header {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 20px 24px; 
            border-bottom: 1px solid #e5e7eb;
        }

        .modal-header h3 { 
            font-size: 16px; 
            font-weight: 700; 
            margin: 0; 
        }

        .modal-close {
            font-size: 24px; 
            cursor: pointer; 
            color: #999; 
            line-height: 1;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #2563eb;
        }

        .modal-body { 
            padding: 24px; 
        }
        
        .selector-title {
            font-size: 12px; 
            color: #999; 
            margin-bottom: 12px; 
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .selector-gallery {
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap; 
            margin-bottom: 16px;
            max-height: 200px; 
            overflow-y: auto;
        }

        .selector-thumb {
            width: calc(33.333% - 7px); 
            aspect-ratio: 16/9;
            object-fit: cover; 
            border-radius: 8px; 
            cursor: pointer;
            border: 2px solid transparent; 
            transition: all 0.2s; 
            background: #eee;
        }

        .selector-thumb:hover { 
            transform: scale(1.05);
            border-color: #2563eb;
        }

        .selector-thumb.selected { 
            border-color: #2563eb; 
            box-shadow: 0 0 0 2px #f0f4ff;
        }

        .btn-upload {
            width: 100%; 
            padding: 14px; 
            border: 2px dashed #d1dff7; 
            border-radius: 8px;
            background: #f0f4ff; 
            color: #2563eb; 
            font-size: 14px; 
            font-weight: 600;
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-upload:hover { 
            border-color: #2563eb; 
            background: #ffffff;
        }

        /* ── Footer Buttons ── */
        .footer {
            display: flex;
            gap: 12px;
            padding: 24px 32px;
            border-top: 1px solid #e5e7eb;
            background: var(--surface-color, #ffffff);
        }

        .btn-draft {
            flex: 1;
            padding: 14px;
            border: 1.5px solid #d1dff7;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            color: #2563eb;
            background: #ffffff;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-draft:hover { 
            border-color: #2563eb;
            background: #f0f4ff;
        }

        .btn-submit {
            flex: 1.5;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            background: #2563eb;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            text-align: center;
        }

        .btn-submit:hover { 
            background: #1d4ed8;
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
            transform: translateY(-1px);
        }

        .btn-submit:active { 
            transform: scale(0.98);
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #111;
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            white-space: nowrap;
            z-index: 999;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── Desktop Layout ── */
        @media (max-width: 1200px) {
            .content {
                grid-template-columns: 1fr;
                gap: 32px;
            }

            .header {
                padding: 16px 24px;
            }

            .content {
                padding: 32px 24px;
            }

            .footer {
                padding: 20px 24px;
            }
        }

        /* ── Mobile Layout ── */
        @media (max-width: 768px) {
            .container {
                max-width: 100%;
            }

            .header {
                padding: 14px 16px;
            }

            .content {
                padding: 24px 16px;
            }

            .footer {
                padding: 16px;
                gap: 8px;
            }

            .btn-draft, .btn-submit {
                font-size: 13px;
                padding: 12px;
            }

            .field-value {
                font-size: 16px;
            }

            .chip {
                font-size: 12px;
                padding: 6px 12px;
            }

    gtag('config', 'G-CHG6831RHH');</script></head><body><div class="container"><div class="header"><div class="header-left"><a href="/ng/publisher/create-post" class="back-btn" title="Go back">← Back to Create</a></div></div><div class="content"><div class="left-column"><div class="field"><div class="field-label">Thumbnail</div><div class="thumbnail-box" id="thumbnailBox" onclick="openThumbModal()"><img id="thumbnailPreview" alt="Thumbnail preview"><div class="thumbnail-placeholder"><div class="thumb-plus"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div><div class="thumb-label">Click to select thumbnail</div></div></div></div></div><div class="right-column"><div class="field"><div class="field-label">Title</div><div class="field-value" id="titleDisplay">Article Title</div></div><div class="divider"></div><div class="field"><div class="field-label">Topics / Tags</div><div class="tags-wrap" id="tagsWrap"></div><input class="topic-input" id="topicInput" placeholder="Add topic and press Enter..." onkeydown="handleTopicKey(event)"></div><div class="divider"></div><div class="category-section"><div class="category-label">Category</div><div class="chips-wrap" id="chipsWrap"><div class="chip" data-slug="study-tips" onclick="selectChip(this)">Study Tips</div><div class="chip" data-slug="exam-updates" onclick="selectChip(this)">Exam Updates</div><div class="chip" data-slug="guide" onclick="selectChip(this)">Guide</div><div class="chip" data-slug="scholarships" onclick="selectChip(this)">Scholarships</div><div class="chip" data-slug="school-news" onclick="selectChip(this)">School News</div></div></div></div></div><div class="footer"><button class="btn-draft" onclick="saveDraft()">Draft</button> <button class="btn-submit" onclick="goToPreview()">Preview</button></div></div><div class="modal" id="thumbModal"><div class="modal-overlay" onclick="closeThumbModal()"></div><div class="modal-content"><div class="modal-header"><h3>Select Thumbnail</h3><div class="modal-close" onclick="closeThumbModal()">&times;</div></div><div class="modal-body"><div class="selector-title" id="galleryTitle" style="display:none;">From your article:</div><div class="selector-gallery" id="selectorGallery"></div><input type="file" accept="image/*" id="thumbnailInput" onchange="handleThumbnail(event)" style="display:none;"> <button class="btn-upload" onclick="document.getElementById('thumbnailInput').click()"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="margin-right: 8px;"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg> Upload from device</button></div></div></div><div class="toast" id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="../../../../components/supabase.js"></script><script>// Load article data from localStorage
    function loadArticleData() {
        try {
            const articleData = JSON.parse(localStorage.getItem('publisher_article_draft'));
            
            if (!articleData) {
                // If no data, try to go back to create
                console.warn('No article data found');
                return;
            }

            // Set title
            document.getElementById('titleDisplay').textContent = articleData.title || 'Untitled';

            // Set thumbnail
            if (articleData.heroImage) {
                document.getElementById('thumbnailPreview').src = articleData.heroImage;
                document.getElementById('thumbnailBox').classList.add('has-image');
            }

            // Set tags/topics
            if (articleData.tags) {
                const tagArray = articleData.tags.split(',').map(t => t.trim()).filter(t => t);
                tagArray.forEach(tag => {
                    if (tag && !topics.includes(tag)) {
                        topics.push(tag);
                    }
                });
                renderTags();
                document.getElementById('topicInput').style.display = 'none';
            }

            // Set category — match by data-slug first, then label text
            if (articleData.category) {
                const needle = articleData.category.toLowerCase().replace(/\s+/g, '-');
                const chips = document.querySelectorAll('.chip');
                chips.forEach(chip => {
                    const chipSlug = chip.dataset.slug || chip.textContent.trim().toLowerCase().replace(/\s+/g, '-');
                    if (chipSlug === needle) {
                        chip.classList.add('selected');
                        selectedCategorySlug = chipSlug;
                    }
                });
            }
        } catch (error) {
            console.error('Error loading article data:', error);
        }
    }

    /* ── Restore title from sessionStorage (no hardcoded fallback) ── */
    const titleDisplay = document.getElementById('titleDisplay');
    const savedTitle = sessionStorage.getItem('post_title');
    if (savedTitle) {
        titleDisplay.textContent = savedTitle;
    }

    /* Read from URL param as additional fallback */
    const params = new URLSearchParams(window.location.search);
    const topicParam = params.get('topic');
    if (topicParam && !savedTitle) {
        titleDisplay.textContent = topicParam;
    }

    // Load data on page load
    document.addEventListener('DOMContentLoaded', loadArticleData);

    /* ── Thumbnail Modal ── */
    function openThumbModal() {
        document.getElementById('thumbModal').classList.add('open');
    }
    function closeThumbModal() {
        document.getElementById('thumbModal').classList.remove('open');
    }

    /* ── Auto-fill / Select Thumbnail from Content ── */
    const postContent = sessionStorage.getItem('post_content');
    if (postContent) {
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = postContent;
        const images = tempDiv.querySelectorAll('img');
        
        if (images.length > 0) {
            const gallery = document.getElementById('selectorGallery');
            document.getElementById('galleryTitle').style.display = 'block';

            // By default, set the first image as the main thumbnail if none is selected
            if (!document.getElementById('thumbnailBox').classList.contains('has-image')) {
                setMainThumbnail(images[0].src);
            }

            // Populate the gallery
            Array.from(images).forEach((img, index) => {
                const thumb = document.createElement('img');
                thumb.src = img.src;
                thumb.className = 'selector-thumb';
                if (document.getElementById('thumbnailPreview').src === img.src) {
                    thumb.classList.add('selected');
                }
                thumb.onclick = () => {
                    document.querySelectorAll('.selector-thumb').forEach(t => t.classList.remove('selected'));
                    thumb.classList.add('selected');
                    setMainThumbnail(img.src);
                    closeThumbModal();
                };
                gallery.appendChild(thumb);
            });
        }
    }

    function setMainThumbnail(src) {
        const imgEl = document.getElementById('thumbnailPreview');
        imgEl.src = src;
        document.getElementById('thumbnailBox').classList.add('has-image');
    }

    /* ── Custom Upload Thumbnail ── */
    function handleThumbnail(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
            setMainThumbnail(ev.target.result);
            // Remove selection from gallery images if a custom one is uploaded
            document.querySelectorAll('.selector-thumb').forEach(t => t.classList.remove('selected'));
            closeThumbModal();
        };
        reader.readAsDataURL(file);
    }

    /* ── Topic Tags (read-only once entered — only cancel allowed) ── */
    const topics = [];
    function handleTopicKey(e) {
        const input = document.getElementById('topicInput');
        const val = input.value.trim();
        if ((e.key === 'Enter' || e.key === ',') && val) {
            e.preventDefault();
            if (!topics.includes(val)) {
                topics.push(val);
                renderTags();
                input.value = '';
                // Hide the input once a topic is confirmed
                input.style.display = 'none';
            }
        }
        // No backspace deletion — user must click × to cancel
    }
    function renderTags() {
        const wrap = document.getElementById('tagsWrap');
        wrap.innerHTML = topics.map((t, i) => `
            <div class="tag-pill">
                <span class="tag-text">${t}</span>
                <span class="tag-remove" onclick="removeTag(${i})" title="Cancel">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </span>
            </div>
        `).join('');
    }
    function removeTag(i) {
        topics.splice(i, 1);
        renderTags();
        // Show input again if no topics remain
        if (topics.length === 0) {
            document.getElementById('topicInput').style.display = '';
            document.getElementById('topicInput').focus();
        }
    }

    /* ── Category chips ── */
    function selectChip(el) {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
        // Store the slug so the pipeline gets 'study-tips' not 'Study Tips'
        selectedCategorySlug = el.dataset.slug || el.textContent.trim().toLowerCase().replace(/\s+/g, '-');
    }

    let selectedCategorySlug = '';

    // ── Shared draft-id key (same key used in create_post.html) ──
    const DRAFT_ID_KEY = 'publisher_draft_post_id';

    // Detect country code from URL slug (e.g. /ng/publisher/post-review → 'ng')
    const CC = (window.location.pathname.split('/')[1] || 'ng').toLowerCase();

    // Persist metadata to the existing Supabase draft row
    async function saveMetadataToSupabase(thumbnailSrc) {
        if (typeof window.MECSupabase === 'undefined') return false;
        let user;
        try { user = await window.MECSupabase.getCurrentUser(); } catch (_) { return false; }
        if (!user) return false;

        const draftId = localStorage.getItem(DRAFT_ID_KEY);
        if (!draftId) return false;           // no draft row to update

        const sb = window.MECSupabase.getSupabase();

        // Build updated draft_content by merging new metadata over the saved JSONB
        // First, fetch the current draft_content so we don't overwrite editor fields
        const { data: existing } = await sb
            .from('publisher_posts')
            .select('draft_content')
            .eq('id', draftId)
            .eq('publisher_id', user.id)
            .maybeSingle();

        const base = (existing && existing.draft_content) ? existing.draft_content : {};

        const merged = {
            ...base,
            heroImage:   thumbnailSrc || base.heroImage || null,
            tags:        topics.join(', '),
            category:    getSelectedCategory(),
            timestamp:   new Date().toISOString()
        };

        const tagArray = topics.length ? topics : (base.tags ? base.tags.split(',').map(t => t.trim()).filter(Boolean) : []);

        const { error } = await sb
            .from('publisher_posts')
            .update({
                thumbnail_url: thumbnailSrc || base.heroImage || null,
                tags:          tagArray,
                category:      getSelectedCategory() || base.category || null,
                draft_content: merged,
                last_saved_at: new Date().toISOString()
            })
            .eq('id', draftId)
            .eq('publisher_id', user.id)
            .in('status', ['draft']);

        if (error) {
            console.warn('Metadata save error:', error.message);
            return false;
        }
        return true;
    }

    function getSelectedCategory() {
        const selected = document.querySelector('.chip.selected');
        return selected ? (selected.dataset.slug || selected.textContent.trim().toLowerCase().replace(/\s+/g, '-')) : null;
    }

    /* ── Draft ── */
    async function saveDraft() {
        const title = titleDisplay.textContent;
        // Keep sessionStorage in sync for post_review → preview handoff
        sessionStorage.setItem('post_title', title);
        sessionStorage.setItem('post_topics', JSON.stringify(topics));

        const thumb = document.getElementById('thumbnailPreview').src;
        const hasThumbnail = document.getElementById('thumbnailBox').classList.contains('has-image');
        if (hasThumbnail && thumb) {
            sessionStorage.setItem('post_thumbnail', thumb);
        }

        // Also persist to Supabase draft
        const ok = await saveMetadataToSupabase(hasThumbnail ? thumb : null);
        showToast(ok ? 'Saved as draft ✓' : 'Saved locally ✓');
    }

    /* ── Preview ── */
    async function goToPreview() {
        const title = titleDisplay.textContent.trim();
        if (!title) {
            showToast('No title found. Please go back and add a title.');
            return;
        }
        const thumb = document.getElementById('thumbnailPreview').src;
        if (!thumb || !document.getElementById('thumbnailBox').classList.contains('has-image')) {
            showToast('Please add a thumbnail image');
            return;
        }

        // Save thumbnail so preview can use it
        sessionStorage.setItem('post_thumbnail', thumb);
        sessionStorage.setItem('post_topics', JSON.stringify(topics));

        // Persist metadata to Supabase before navigating
        await saveMetadataToSupabase(thumb);

        window.location.href = '/ng/publisher/preview';
    }

    /* ── Toast helper ── */
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2800);
    }</script></body></html>
