<script>
  // Reading Progress Bar
  document.addEventListener('scroll', function() {
    const scrollTop = window.scrollY;
    const docHeight = document.body.scrollHeight;
    const winHeight = window.innerHeight;
    const progressPercent = Math.min(100, Math.max(0, (scrollTop / (docHeight - winHeight)) * 100));
    document.getElementById('reading-progress').style.width = progressPercent + '%';
  });

  // ── Share Article ──
  function shareArticle() {
    if (navigator.share) {
      navigator.share({ title: document.title, url: window.location.href });
    } else {
      navigator.clipboard.writeText(window.location.href);
      alert('Link copied to clipboard!');
    }
  }

  // ── Auto-resize iframe height ──
  function fitIframe(iframe) {
    try {
      iframe.style.height = iframe.contentWindow.document.body.scrollHeight + 'px';
    } catch(e) {}
  }

  // ── Main: Load article from Supabase ──
  document.addEventListener('DOMContentLoaded', async () => {
    const params = new URLSearchParams(window.location.search);
    const postId = params.get('id');

    if (!postId) {
      // No ID: redirect back to categories
      window.location.href = 'categories.html';
      return;
    }

    const sb = window.MECSupabase.getSupabase();
    const { data: post, error } = await sb
      .from('publisher_posts')
      .select('*')
      .eq('id', postId)
      .eq('status', 'approved')
      .single();

    if (error || !post) {
      document.getElementById('loadingState').innerHTML = '<p style="color:red;">Article not found or not yet approved.</p>';
      return;
    }

    // ── Update SEO meta tags dynamically (AdSense-friendly) ──
    document.title = `${post.title} | MyExamHub`;
    document.querySelector('meta[name="description"]').content = `${post.title}. Read the full article on MyExamHub.`;
    document.querySelector('meta[property="og:title"]').content = post.title;
    document.querySelector('meta[property="og:description"]').content = `${post.title} - Read on MyExamHub`;
    if (post.thumbnail_url) {
      document.querySelector('meta[property="og:image"]').content = post.thumbnail_url;
    }

    // ── Populate article header ──
    const firstTopic = post.topics && post.topics.length ? '#' + post.topics[0].toUpperCase() : '#ARTICLE';
    document.getElementById('articleTag').textContent = firstTopic;
    document.getElementById('articleTitle').textContent = post.title;
    document.getElementById('articleDate').textContent = new Date(post.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

    // Update back nav label
    const firstCategory = post.topics && post.topics.length ? post.topics[0] : 'Articles';
    document.getElementById('backCategoryLabel').textContent = firstCategory;

    // ── Hero Image ──
    if (post.thumbnail_url) {
      document.getElementById('articleHeroImg').src = post.thumbnail_url;
      document.getElementById('articleHero').style.display = 'block';
    }

    // ── Load article HTML from Cloudflare R2 or GitHub fallback via iframe srcdoc ──
    const articleUrl = post.cloudflare_url || post.github_url;
    if (articleUrl) {
      fetch(articleUrl)
        .then(res => res.text())
        .then(html => {
          const iframe = document.getElementById('articleBodyFrame');
          iframe.srcdoc = html;
          iframe.onload = () => fitIframe(iframe);
        })
        .catch(() => {
          document.getElementById('articleBodyFrame').srcdoc = '<p style="color:red;padding:20px;">Failed to load article content.</p>';
        });
    } else {
      document.getElementById('articleBodyFrame').srcdoc = '<p style="color:gray;padding:20px;">No article content available.</p>';
    }

    // ── Tags ──
    if (post.topics && post.topics.length) {
      const tagsHtml = post.topics.map(t => `<a href="categories.html?category=${encodeURIComponent(t)}" class="tag-pill">${t}</a>`).join('');
      document.getElementById('articleTagsContainer').innerHTML = tagsHtml;
    }

    // ── Show article shell ──
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('articleShell').style.display = 'block';

    // ── Fetch related articles (same topic, different post) ──
    const { data: related } = await sb
      .from('publisher_posts')
      .select('id, title, thumbnail_url, topics, created_at')
      .eq('status', 'approved')
      .neq('id', postId)
      .limit(3);

    if (related && related.length > 0) {
      document.getElementById('relatedTitle').textContent = post.topics && post.topics.length ? 'More from ' + post.topics[0] : 'More Articles';
      document.getElementById('relatedList').innerHTML = related.map(r => {
        const tag = r.topics && r.topics.length ? '#' + r.topics[0].toUpperCase() : '#ARTICLE';
        const thumb = r.thumbnail_url
          ? `<img loading="lazy" class="fb-list-item__img" src="${r.thumbnail_url}" alt="${r.title}">`
          : `<div style="width:100%;height:100%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:12px;color:#999;">No image</div>`;
        return `
          <article class="fb-list-item">
            <a href="content.html?id=${r.id}">
              <div class="fb-list-item__img-wrap">${thumb}</div>
            </a>
            <div class="fb-list-item__body">
              <div class="fb-tag">${tag}</div>
              <a href="content.html?id=${r.id}">
                <h2 class="fb-list-item__title">${r.title}</h2>
              </a>
              <div class="fb-source">MyExamHub Publisher</div>
            </div>
          </article>`;
      }).join('');
      document.getElementById('relatedSection').style.display = 'block';
    }
  });
</script>
</body>
</html>
