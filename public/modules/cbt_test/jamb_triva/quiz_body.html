<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAMB Trivia Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #e8f0fe;
            height: 100dvh;
            overflow: hidden;
        }
        /* TOP BAR */
        .top-bar {
            position: fixed; top: 0; left: 0; right: 0; height: 64px;
            background: #ffffff; border-bottom: 1px solid #e8e8e8;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .top-bar__menu {
            width: 42px; height: 42px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            background: #f4f4f5; cursor: pointer; border: none; outline: none;
            flex-shrink: 0; transition: background 0.15s;
        }
        .top-bar__menu:hover { background: #e8e8e8; }
        .top-bar__menu svg { width: 20px; height: 20px; stroke: #374151; }
        .top-bar__center {
            font-size: 14px; font-weight: 700; color: #6b7280; letter-spacing: 0.02em;
        }
        .top-bar__right { display: flex; align-items: center; gap: 8px; }
        .pill {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 14px; border-radius: 9999px;
            font-weight: 800; font-size: 15px; white-space: nowrap;
        }
        .pill--score { background: #fff0f0; color: #b70c01; }
        .pill--timer { background: #f0f4ff; color: #2563eb; }
        .pill--timer.warning { background: #fff3cd; color: #d97706; animation: warn 1s ease infinite; }
        @keyframes warn { 0%,100%{opacity:1}50%{opacity:0.65} }

        /* QUESTION CARD */
        .question-card {
            position: fixed; top: 64px; left: 0; right: 0; z-index: 90;
            background: #fff; border-bottom: 1px solid #f0f0f0;
            padding: 22px 24px; text-align: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .question-card__text {
            font-size: 18px; font-weight: 700; color: #111827;
            line-height: 1.5; max-width: 680px; margin: 0 auto;
        }
        @media (max-width: 480px) { .question-card__text { font-size: 15px; } }

        /* ARENA */
        .arena {
            position: fixed; left: 0; right: 0; bottom: 0;
            overflow: hidden; z-index: 5;
            background: linear-gradient(155deg, #dbeafe 0%, #e0e7ff 45%, #fce7f3 100%);
        }

        /* BALLOONS */
        .balloon {
            position: absolute; width: 140px; height: 140px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 14px;
            font-size: 15px; font-weight: 700; color: #fff;
            cursor: pointer; user-select: none; will-change: transform;
            box-shadow: 0 12px 28px rgba(0,0,0,0.18),
                        inset 0 -12px 20px rgba(0,0,0,0.12),
                        inset 0 4px 8px rgba(255,255,255,0.28);
        }
        .balloon::before {
            content: ''; position: absolute; top: 18%; left: 25%;
            width: 30%; height: 20%; background: rgba(255,255,255,0.35);
            border-radius: 50%; transform: rotate(-30deg); pointer-events: none;
        }
        .balloon:hover {
            box-shadow: 0 18px 40px rgba(0,0,0,0.24),
                        inset 0 -12px 20px rgba(0,0,0,0.12),
                        inset 0 4px 8px rgba(255,255,255,0.28);
        }
        .color-0 { background: radial-gradient(circle at 35% 35%, #ff8a80, #c0392b); }
        .color-1 { background: radial-gradient(circle at 35% 35%, #64b5f6, #1565c0); }
        .color-2 { background: radial-gradient(circle at 35% 35%, #81c784, #2e7d32); }
        .color-3 { background: radial-gradient(circle at 35% 35%, #fff176, #f57f17); color: #1a1a1a; }
        .balloon.wrong { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
        @keyframes pop {
            0%  { transform: scale(1);    opacity: 1; }
            40% { transform: scale(1.35); opacity: 0.8; }
            100%{ transform: scale(0);    opacity: 0; }
        }
        .balloon.popping { animation: pop 0.35s ease-out forwards; pointer-events: none; }
        @keyframes shake {
            0%,100%{ translate: 0px; }
            20%{ translate: -12px; } 40%{ translate: 12px; }
            60%{ translate: -9px; }  80%{ translate: 9px; }
        }
        .balloon.shaking { animation: shake 0.35s ease; }

        /* ATTEMPT DOTS */
        .attempts-bar {
            position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 9px; z-index: 90;
        }
        .dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: rgba(255,255,255,0.45);
            border: 2px solid rgba(255,255,255,0.75);
            transition: background 0.2s, border-color 0.2s;
        }
        .dot.wrong  { background: #b70c01; border-color: #b70c01; }
        .dot.nopts  { background: #f59e0b; border-color: #f59e0b; }

        /* TOAST */
        .toast {
            position: fixed; top: 74px; left: 50%;
            transform: translateX(-50%) translateY(-6px);
            background: #111827; color: #fff;
            padding: 8px 20px; border-radius: 9999px;
            font-size: 13px; font-weight: 600;
            opacity: 0; transition: opacity 0.25s, transform 0.25s;
            z-index: 150; pointer-events: none; white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* GAME OVER MODAL */
        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 200; align-items: center; justify-content: center;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .modal.active { display: flex; }
        .modal-box {
            background: #fff; padding: 48px 40px; border-radius: 28px;
            text-align: center; max-width: 400px; width: 90%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
            animation: slideUp 0.35s ease-out;
        }
        @keyframes slideUp {
            from { opacity:0; transform: translateY(28px); }
            to   { opacity:1; transform: translateY(0); }
        }
        .modal-emoji { font-size: 54px; margin-bottom: 10px; }
        .modal-title { font-size: 30px; font-weight: 800; color: #111827; margin-bottom: 6px; }
        .modal-sub   { font-size: 15px; color: #6b7280; margin-bottom: 8px; }
        .modal-pts   { font-size: 70px; font-weight: 800; color: #b70c01; line-height: 1; margin-bottom: 6px; }
        .modal-qlbl  { font-size: 13px; color: #9ca3af; margin-bottom: 32px; }
        .modal-btns  { display: flex; gap: 12px; justify-content: center; }
        .mbtn {
            padding: 13px 26px; border-radius: 9999px;
            font-weight: 700; font-size: 15px; cursor: pointer; border: none; transition: all 0.2s;
        }
        .mbtn-primary { background: #b70c01; color: #fff; box-shadow: 0 4px 12px rgba(183,12,1,0.25); }
        .mbtn-primary:hover { background: #960a01; transform: translateY(-1px); }
        .mbtn-ghost   { background: #f4f4f5; color: #374151; }
        .mbtn-ghost:hover { background: #e5e7eb; }

        /* ── Game Menu Drawer ── */
        .menu-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.5); z-index: 300;
            backdrop-filter: blur(4px);
        }
        .menu-overlay.open { display: block; }

        .menu-drawer {
            position: fixed; top: 0; right: 0; bottom: 0;
            width: 280px; background: #fff;
            z-index: 301; padding: 0;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
            box-shadow: -8px 0 32px rgba(0,0,0,0.15);
            display: flex; flex-direction: column;
        }
        .menu-drawer.open { transform: translateX(0); }

        .menu-drawer__header {
            padding: 24px 20px 16px;
            border-bottom: 1px solid #f0f0f0;
            display: flex; align-items: center; justify-content: space-between;
        }
        .menu-drawer__title {
            font-size: 18px; font-weight: 800; color: #111827;
        }
        .menu-drawer__close {
            width: 36px; height: 36px; border-radius: 10px;
            background: #f4f4f5; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }
        .menu-drawer__close:hover { background: #e5e7eb; }

        .menu-drawer__body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 10px; }

        .menu-item {
            display: flex; align-items: center; gap: 14px;
            padding: 16px 18px; border-radius: 14px;
            background: #f9fafb; border: 1px solid #f0f0f0;
            cursor: pointer; font-weight: 600; font-size: 15px; color: #111827;
            border: none; text-align: left; width: 100%;
            transition: background 0.15s;
        }
        .menu-item:hover { background: #f0f0f0; }
        .menu-item.danger { color: #b70c01; background: #fff0f0; }
        .menu-item.danger:hover { background: #ffe0e0; }
        .menu-item__icon { font-size: 22px; }

        .menu-drawer__footer {
            padding: 16px 16px 24px;
            border-top: 1px solid #f0f0f0;
        }
        .menu-score-box {
            background: linear-gradient(135deg, #b70c01, #e53e3e);
            border-radius: 14px; padding: 16px 20px; color: white; text-align: center;
        }
        .menu-score-box__label { font-size: 12px; opacity: 0.85; margin-bottom: 4px; }
        .menu-score-box__value { font-size: 32px; font-weight: 800; }
    </style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
    <button class="top-bar__menu" onclick="openMenu()" title="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
    </button>

    <span class="top-bar__center" id="q-counter">Q 1 / 8</span>

    <div class="top-bar__right">
        <div class="pill pill--score">&#x1F3C6; <span id="score-el">0</span></div>
        <div class="pill pill--timer" id="timer-pill">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            <span id="timer-el">03:00</span>
        </div>
    </div>
</div>

<!-- QUESTION CARD -->
<div class="question-card" id="q-card">
    <p class="question-card__text" id="q-text">Get ready&#8230;</p>
</div>

<!-- ARENA -->
<div class="arena" id="arena"></div>

<!-- ATTEMPT DOTS -->
<div class="attempts-bar">
    <div class="dot" id="d0"></div>
    <div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div>
    <div class="dot" id="d3"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- GAME MENU DRAWER -->
<div class="menu-overlay" id="menu-overlay" onclick="closeMenu()"></div>
<div class="menu-drawer" id="menu-drawer">
    <div class="menu-drawer__header">
        <span class="menu-drawer__title">&#x1F3AE; Game Menu</span>
        <button class="menu-drawer__close" onclick="closeMenu()">&#x2715;</button>
    </div>
    <div class="menu-drawer__body">
        <button class="menu-item" onclick="closeMenu()">
            <span class="menu-item__icon">&#x25B6;&#xFE0F;</span> Resume Game
        </button>
        <button class="menu-item" onclick="restartFromMenu()">
            <span class="menu-item__icon">&#x1F501;</span> Restart
        </button>
        <button class="menu-item" onclick="window.location.href='jamb_triva_subject.html'">
            <span class="menu-item__icon">&#x1F4CB;</span> Change Subject
        </button>
        <button class="menu-item danger" onclick="window.location.href='../../../modules/index.html'">
            <span class="menu-item__icon">&#x1F3E0;</span> Exit to Home
        </button>
    </div>
    <div class="menu-drawer__footer">
        <div class="menu-score-box">
            <div class="menu-score-box__label">Current Score</div>
            <div class="menu-score-box__value" id="menu-score">0</div>
        </div>
    </div>
</div>

<!-- GAME OVER MODAL -->
<div class="modal" id="modal">
    <div class="modal-box">
        <div class="modal-emoji" id="m-emoji">&#x23F1;&#xFE0F;</div>
        <h2 class="modal-title" id="m-title">Time's Up!</h2>
        <p class="modal-sub">Your Final Score</p>
        <div class="modal-pts" id="m-score">0</div>
        <p class="modal-qlbl" id="m-qlbl">0 questions answered</p>
        <div class="modal-btns">
            <button class="mbtn mbtn-ghost" onclick="location.href='jamb_triva_subject.html'">&#x1F3E0; Home</button>
            <button class="mbtn mbtn-primary" onclick="restart()">&#x1F501; Play Again</button>
        </div>
    </div>
</div>

<script>
/* -- Menu Drawer -- */
function openMenu(){
    document.getElementById('menu-overlay').classList.add('open');
    document.getElementById('menu-drawer').classList.add('open');
    document.getElementById('menu-score').textContent = score || 0;
}
function closeMenu(){
    document.getElementById('menu-overlay').classList.remove('open');
    document.getElementById('menu-drawer').classList.remove('open');
}
function restartFromMenu(){
    closeMenu();
    setTimeout(restart, 200);
}

/* -- Audio -- */
let aCtx;
function snd(type){
    try{
        if(!aCtx) aCtx=new(window.AudioContext||window.webkitAudioContext)();
        if(aCtx.state==='suspended') aCtx.resume();
        const o=aCtx.createOscillator(), g=aCtx.createGain();
        o.connect(g); g.connect(aCtx.destination);
        if(type==='correct'){
            o.type='sine';
            o.frequency.setValueAtTime(440,aCtx.currentTime);
            o.frequency.exponentialRampToValueAtTime(880,aCtx.currentTime+0.12);
            g.gain.setValueAtTime(0.4,aCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001,aCtx.currentTime+0.4);
            o.start(); o.stop(aCtx.currentTime+0.4);
            const o2=aCtx.createOscillator(),g2=aCtx.createGain();
            o2.connect(g2); g2.connect(aCtx.destination);
            o2.type='sine';
            o2.frequency.setValueAtTime(660,aCtx.currentTime+0.1);
            o2.frequency.exponentialRampToValueAtTime(1320,aCtx.currentTime+0.22);
            g2.gain.setValueAtTime(0.2,aCtx.currentTime+0.1);
            g2.gain.exponentialRampToValueAtTime(0.001,aCtx.currentTime+0.5);
            o2.start(aCtx.currentTime+0.1); o2.stop(aCtx.currentTime+0.5);
        } else {
            o.type='sawtooth';
            o.frequency.setValueAtTime(200,aCtx.currentTime);
            o.frequency.linearRampToValueAtTime(80,aCtx.currentTime+0.25);
            g.gain.setValueAtTime(0.3,aCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001,aCtx.currentTime+0.25);
            o.start(); o.stop(aCtx.currentTime+0.25);
        }
    }catch(e){}
}

/* -- Questions -- */
const Qs=[
    {t:"What is the capital of Nigeria?",             o:["Lagos","Abuja","Kano","Ibadan"],               a:1},
    {t:"Who wrote 'Things Fall Apart'?",              o:["Wole Soyinka","Chimamanda Adichie","Chinua Achebe","Buchi Emecheta"], a:2},
    {t:"Chemical symbol for Gold?",                   o:["Ag","Au","Pb","Fe"],                           a:1},
    {t:"Planet closest to the sun?",                  o:["Venus","Earth","Mars","Mercury"],               a:3},
    {t:"Largest continent by area?",                  o:["Africa","Asia","North America","Europe"],       a:1},
    {t:"Year Nigeria gained independence?",           o:["1957","1960","1963","1966"],                    a:1},
    {t:"What is H\u2082O commonly known as?",         o:["Oxygen","Hydrogen","Water","Carbon Dioxide"],   a:2},
    {t:"How many states are in Nigeria?",             o:["30","34","36","38"],                            a:2},
];

/* -- Config -- */
const cfg   = JSON.parse(localStorage.getItem('trivia_config')||'{}');
const parts = (cfg.time||'3').split('|');
let totalSec  = parseInt(parts[0])*60;
const bonusSec= parts[1] ? parseInt(parts[1]) : 0;

/* -- State -- */
let qi=0, score=0, attempts=0, answered=0;
let balls=[], running=false, rafId=null, timerId=null;
const BS=140; // balloon size px
let arenaTop=0;

/* -- DOM -- */
const arenaEl  = document.getElementById('arena');
const qText    = document.getElementById('q-text');
const qCounter = document.getElementById('q-counter');
const scoreEl  = document.getElementById('score-el');
const timerEl  = document.getElementById('timer-el');
const timerPill= document.getElementById('timer-pill');
const modal    = document.getElementById('modal');
const toastEl  = document.getElementById('toast');
const dots     = [0,1,2,3].map(i=>document.getElementById('d'+i));

/* -- Layout -- */
function relayout(){
    const r=document.getElementById('q-card').getBoundingClientRect();
    arenaTop=r.bottom;
    arenaEl.style.top=arenaTop+'px';
}

/* -- Timer -- */
function fmt(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function tickTimer(){
    totalSec--;
    if(totalSec<=0){totalSec=0;timerEl.textContent=fmt(0);endGame();return;}
    timerEl.textContent=fmt(totalSec);
    timerPill.classList.toggle('warning',totalSec<=30);
}

/* -- Toast -- */
let tTO;
function toast(msg){ clearTimeout(tTO); toastEl.textContent=msg; toastEl.classList.add('show'); tTO=setTimeout(()=>toastEl.classList.remove('show'),1500); }

/* -- Dots -- */
function resetDots(){ dots.forEach(d=>d.className='dot'); }
function markDot(i,cls){ if(dots[i]) dots[i].classList.add(cls); }

/* -- Question -- */
function loadQ(){
    if(qi>=Qs.length) qi=0;
    attempts=0; resetDots();
    const q=Qs[qi];
    qText.textContent=q.t;
    qCounter.textContent='Q '+(qi+1)+' / '+Qs.length;
    requestAnimationFrame(()=>{ relayout(); spawnBalls(q); });
}

/* -- Balloons -- */
function areaH(){ return window.innerHeight-arenaTop; }
function spawnBalls(q){
    arenaEl.innerHTML=''; balls=[];
    const W=window.innerWidth, H=areaH();
    for(let i=0;i<4;i++){
        const el=document.createElement('div');
        el.className='balloon color-'+i;
        el.textContent=q.o[i];
        // Spread across 2x2 grid so none overlap at start
        const col=i%2, row=Math.floor(i/2);
        const cW=W/2, cH=H/2;
        const x=col*cW+Math.max(0,Math.random()*(cW-BS));
        const y=row*cH+Math.max(0,Math.random()*(cH-BS));
        const spd=0.18+Math.random()*0.12; // gentle drift (0.18-0.30 px/frame)
        const ang=Math.random()*Math.PI*2;
        el.style.cssText='left:'+x+'px;top:'+y+'px';
        const b={el,x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,correct:i===q.a,dead:false};
        el.addEventListener('click',()=>hit(b));
        arenaEl.appendChild(el);
        balls.push(b);
    }
}

/* -- Hit -- */
function hit(b){
    if(b.dead||!running) return;
    attempts++;
    if(b.correct){
        snd('correct'); b.dead=true; b.el.classList.add('popping');
        const pts = attempts===1?10:attempts===2?5:0;
        score+=pts; scoreEl.textContent=score; answered++;
        if(bonusSec){ totalSec+=bonusSec; timerEl.textContent=fmt(totalSec); }
        const msgs=['','&#x1F389;+10 pts!','&#x2705;+5 pts','No points','No points'];
        toast(msgs[Math.min(attempts,4)]);
        setTimeout(()=>{ qi++; loadQ(); },360);
    } else {
        snd('wrong'); b.dead=true; b.el.classList.add('wrong');
        markDot(attempts-1, attempts>=3?'nopts':'wrong');
        score=Math.max(0,score-3); scoreEl.textContent=score;
        toast('&#x274C; -3 pts');
    }
}

/* -- Game Loop -- */
function loop(){
    if(!running) return;
    const W=window.innerWidth, H=areaH();
    for(const b of balls){
        if(b.dead) continue;
        b.x+=b.vx; b.y+=b.vy;
        if(b.x<=0){b.x=0;b.vx=Math.abs(b.vx);}
        if(b.x+BS>=W){b.x=W-BS;b.vx=-Math.abs(b.vx);}
        if(b.y<=0){b.y=0;b.vy=Math.abs(b.vy);}
        if(b.y+BS>=H){b.y=H-BS;b.vy=-Math.abs(b.vy);}
        b.el.style.transform='translate('+(b.x-parseFloat(b.el.style.left))+'px,'+(b.y-parseFloat(b.el.style.top))+'px)';
    }
    rafId=requestAnimationFrame(loop);
}

/* -- Start / End / Restart -- */
function startGame(){
    score=0;qi=0;answered=0;running=true;
    scoreEl.textContent=0;
    timerEl.textContent=fmt(totalSec);
    relayout();
    timerId=setInterval(tickTimer,1000);
    loadQ();
    rafId=requestAnimationFrame(loop);
}
function endGame(){
    running=false;
    clearInterval(timerId); cancelAnimationFrame(rafId);
    arenaEl.innerHTML='';
    document.getElementById('m-score').textContent=score;
    document.getElementById('m-qlbl').textContent=answered+' question'+(answered!==1?'s':'')+' answered';
    if(score>=50){document.getElementById('m-emoji').textContent='??';document.getElementById('m-title').textContent='Excellent!';}
    else if(score>=20){document.getElementById('m-emoji').textContent='?';document.getElementById('m-title').textContent='Good Job!';}
    modal.classList.add('active');
}
function restart(){
    modal.classList.remove('active');
    totalSec=parseInt(parts[0])*60;
    startGame();
}

window.addEventListener('resize',()=>{
    relayout();
    const W=window.innerWidth,H=areaH();
    for(const b of balls){
        if(b.x+BS>W) b.x=W-BS;
        if(b.y+BS>H) b.y=H-BS;
    }
});

window.addEventListener('DOMContentLoaded',()=>{ relayout(); setTimeout(startGame,150); });
</script>
</body>
</html>
