<!DOCTYPE html>
<html lang="en">

<head>
<script>
  /* Anti-flash: apply saved theme before first paint */
  (function() {
    try {
      var t = localStorage.getItem('mec_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch(e) {}
  })();
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>AI Study Plan - My Exam Companion</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../../../components/supabase.js"></script>
    <meta name="description" content="Your AI-powered study tutor for JAMB, WAEC, and NECO prep.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script defer src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="../../../components/topbar.css">
    <link rel="stylesheet" href="../../../components/dark-mode.css">
    <link rel="stylesheet" href="../../../components/sidebar.css?v=4">
    <style>
        /* ------------------------------------------
           DESIGN TOKENS
        ------------------------------------------ */
        :root {
            --bg: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-muted: #64748b;
            --accent: #2563eb;
            --border: #e2e8f0;
            --input-bg: #ffffff;
            --chip-bg: #ffffff;
            --chip-border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --radius-xl: 20px;
            --radius-lg: 14px;
            --radius-full: 999px;
            --chat-bubble-user: #fafafa;
        }

        :root[data-theme="dark"] {
            --bg: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --input-bg: #1e293b;
            --chip-bg: #1e293b;
            --chip-border: #334155;
            --chat-bubble-user: #334155;
        }

        /* ------------------------------------------
           RESET & BASE
        ------------------------------------------ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            display: flex;
            min-height: 100vh;
            height: 100vh;
            overflow: hidden;
            max-width: 100vw;
            overflow-x: hidden;
        }

        /* ------------------------------------------
           LAYOUT  sidebar offset
        ------------------------------------------ */
        .app-container {
            margin-left: 90px;
            flex: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            overflow-x: hidden;
            max-width: 100vw;
            background: var(--bg);
        }

        /* ------------------------------------------
           TOP BAR
        ------------------------------------------ */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 28px;
            flex-shrink: 0;
            background: var(--bg);
        }

        .topbar__logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .topbar__brand {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.2px;
        }

        .topbar__plan {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--chip-bg);
            border: 1px solid var(--chip-border);
            border-radius: var(--radius-full);
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: box-shadow 0.15s;
        }

        .topbar__plan:hover {
            box-shadow: var(--shadow-sm);
        }

        .topbar__plan-sep {
            width: 1px;
            height: 14px;
            background: var(--chip-border);
        }

        .topbar__plan-upgrade {
            color: var(--text-primary);
            font-weight: 600;
        }

        .topbar__icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 20px;
            transition: background 0.15s;
        }

        .topbar__icon-btn:hover {
            background: rgba(0, 0, 0, 0.06);
        }

        /* ------------------------------------------
           MAIN  scrollable content area
        ------------------------------------------ */
        .main {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: none;
            display: flex;
            flex-direction: column;
        }

        .main::-webkit-scrollbar {
            display: none;
        }

        /* ------------------------------------------
           HERO SECTION
        ------------------------------------------ */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px 32px;
            text-align: center;
        }

        .hero__icon {
            font-size: 52px;
            line-height: 1;
            margin-bottom: 20px;
            animation: spin-star 12s linear infinite;
            display: inline-block;
            color: var(--accent);
        }

        @keyframes spin-star {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Star SVG icon */
        .hero__star {
            width: 56px;
            height: 56px;
            margin-bottom: 20px;
            animation: spin-star 14s linear infinite;
            flex-shrink: 0;
        }

        .hero__title {
            font-family: 'Instrument Serif', Georgia, serif;
            font-size: clamp(32px, 6vw, 52px);
            font-weight: 400;
            color: var(--text-primary);
            line-height: 1.12;
            letter-spacing: -0.5px;
            max-width: 520px;
        }

        .hero__title em {
            font-style: italic;
            color: #4a4a44;
        }

        /* ------------------------------------------
           INPUT AREA
        ------------------------------------------ */
        .input-section {
            padding: 0 24px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
            position: sticky;
            bottom: 0;
            background: var(--bg);
            z-index: 10;
            /* Ensure input is always above the iOS/Android virtual keyboard */
            padding-bottom: max(24px, env(safe-area-inset-bottom));
        }

        .input-card {
            width: 100%;
            max-width: 680px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .input-textarea {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 400;
            color: var(--text-primary);
            resize: none;
            padding: 20px 22px 8px;
            min-height: 64px;
            max-height: 200px;
            line-height: 1.5;
        }

        .input-textarea::placeholder {
            color: #aaa;
            font-weight: 400;
        }

        .input-toolbar {
            display: flex;
            align-items: center;
            padding: 10px 14px 14px;
            gap: 6px;
        }

        .toolbar-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: none;
            border-radius: var(--radius-full);
            padding: 8px 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
        }

        .toolbar-btn:hover {
            background: rgba(0, 0, 0, 0.05);
            color: var(--text-primary);
        }

        .toolbar-btn i {
            font-size: 18px;
        }

        .toolbar-sep {
            width: 1px;
            height: 20px;
            background: var(--border);
            flex-shrink: 0;
        }

        .toolbar-spacer {
            flex: 1;
        }

        .toolbar-icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 20px;
            transition: background 0.15s, color 0.15s;
            flex-shrink: 0;
        }

        .toolbar-icon-btn:hover {
            background: rgba(128, 128, 128, 0.15);
            color: var(--text-primary);
        }

        .submit-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--text-primary);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            font-size: 17px;
            transition: background 0.2s, transform 0.2s;
            flex-shrink: 0;
        }

        .submit-btn:hover {
            background: #333;
            transform: scale(1.05);
        }

        /* ------------------------------------------
           QUICK-ACTION CHIPS
        ------------------------------------------ */
        .chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 680px;
        }

        .chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--chip-bg);
            border: 1px solid var(--chip-border);
            border-radius: var(--radius-full);
            padding: 9px 18px;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: box-shadow 0.15s, background 0.15s;
            box-shadow: var(--shadow-sm);
        }

        .chip:hover {
            box-shadow: var(--shadow-md);
            background: #f8f8f5;
        }

        .chip i {
            font-size: 16px;
            color: var(--text-muted);
        }

        /* ------------------------------------------
           CHAT UI
        ------------------------------------------ */
        .chat-container {
            display: none;
            flex-direction: column;
            gap: 24px;
            padding: 20px 24px;
            flex: 1;
            overflow-y: auto;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            overflow-x: hidden;
        }
        
        .chat-container.active {
            display: flex;
        }

        .chat-msg {
            display: flex;
            gap: 16px;
            max-width: 100%;
        }

        .chat-msg.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .chat-avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px; /* Square with rounded corners like Claude */
            background: var(--bg-card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--accent);
            font-weight: 600;
        }

        .chat-msg.user .chat-avatar {
            background: var(--text-primary);
            color: var(--bg);
            border-color: var(--text-primary);
        }

        .chat-bubble {
            background: transparent; /* Claude typically doesn't have a bubble for AI */
            padding: 4px 0;
            font-size: 16px;
            line-height: 1.7;
            color: var(--text-primary);
            max-width: calc(100% - 48px);
        }

        .chat-msg.user .chat-bubble {
            background: var(--chat-bubble-user); /* Subtle background for user */
            padding: 12px 16px;
            border-radius: 12px;
            border-bottom-right-radius: 4px;
        }

        .chat-msg.ai .chat-bubble {
            border-bottom-left-radius: 4px;
        }

        /* Markdown elements */
        .chat-bubble strong { font-weight: 600; }
        .chat-bubble ul, .chat-bubble ol { padding-left: 20px; margin: 12px 0; }
        .chat-bubble li { margin-bottom: 6px; }
        .chat-bubble p { margin-bottom: 12px; line-height: 1.6; }
        .chat-bubble p:last-child { margin-bottom: 0; }
        
        /* Markdown Tables */
        .chat-bubble table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            font-size: 14px;
        }
        .chat-bubble th, .chat-bubble td {
            padding: 12px 16px;
            border: 1px solid var(--border);
            text-align: left;
        }
        .chat-bubble th {
            background: var(--bg);
            font-weight: 600;
        }

        /* Typing indicator */
        .typing {
            display: flex;
            gap: 4px;
            padding: 8px 4px;
        }
        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        .quiz-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px 16px;
            margin: 8px 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            color: var(--text-primary);
            transition: all 0.2s;
        }
        .quiz-btn:hover {
            border-color: var(--accent);
            background: var(--bg);
        }
        .quiz-btn.correct { background: #ecfdf5; border-color: #10b981; color: #065f46; }
        .quiz-btn.wrong { background: #fef2f2; border-color: #ef4444; color: #991b1b; }
        :root[data-theme="dark"] .quiz-btn:not(.correct):not(.wrong) { background: #1e293b; color: #f1f5f9; border-color: #334155; }
        :root[data-theme="dark"] .quiz-btn:not(.correct):not(.wrong):hover { background: #273548; border-color: var(--accent); }

        /* ------------------------------------------
           RESPONSIVE  Tablet = 768px
        ------------------------------------------ */
        @media (max-width: 768px) {
            .app-container {
                margin-left: 80px;
            }
        }

        /* ------------------------------------------
           RESPONSIVE  Mobile = 600px
        ------------------------------------------ */
        @media (max-width: 600px) {
            .app-container {
                margin-left: 0;
            }

            .topbar {
                padding: 12px 16px;
            }

            .topbar__plan-sep,
            .topbar__plan-upgrade {
                display: none;
            }

            .hero {
                padding: 32px 20px 20px;
            }

            .hero__star {
                width: 44px;
                height: 44px;
                margin-bottom: 16px;
            }

            .hero__title {
                font-size: clamp(28px, 8vw, 38px);
            }

            .input-section {
                padding: 0 10px max(16px, env(safe-area-inset-bottom));
                gap: 10px;
            }

            .input-card {
                max-width: 100%;
            }

            /* Hide model selector text on very small screens */
            .toolbar-btn .toolbar-model-name {
                display: none;
            }

            /* Ensure send + mic buttons are always fully visible */
            .toolbar-icon-btn {
                width: 36px;
                height: 36px;
                flex-shrink: 0;
            }

            .input-toolbar {
                padding: 8px 10px 10px;
            }

            .chips {
                gap: 8px;
                padding-bottom: 4px;
            }

            .chip {
                font-size: 13px;
                padding: 8px 14px;
            }
        }

        /* ------------------------------------------
           RESPONSIVE  Very small = 360px
        ------------------------------------------ */
        @media (max-width: 360px) {
            .hero__title {
                font-size: 26px;
            }

            .toolbar-sep {
                display: none;
            }
        }
        .ad-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .ad-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .ad-modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 32px;
            border-radius: var(--radius-xl);
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transform: translateY(20px);
            transition: transform 0.3s;
        }

        .ad-modal-overlay.active .ad-modal {
            transform: translateY(0);
        }

        .ad-modal h2 {
            font-size: 24px;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .ad-modal p {
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .ad-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: var(--radius-full);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .ad-btn:hover {
            background: #1d4ed8;
        }

        #vast-video-container {
            display: none;
            width: 100%;
            margin-bottom: 20px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        #vast-video-container video {
            width: 100%;
            display: block;
        }
    </style>
</head>

<body>
    <app-sidebar data-base="/"></app-sidebar>

    <!-- Ad Modal Overlay -->
    <div class="ad-modal-overlay" id="ad-modal">
        <div class="ad-modal">
            <i class="ph ph-lock-key" style="font-size: 48px; color: var(--accent); margin-bottom: 16px;"></i>
            <h2>Premium Tutor Locked</h2>
            <p>Your free session has expired. Watch a short video ad to unlock another 1 hour of premium AI tutoring.</p>
            
            <div id="vast-video-container" style="min-height: 250px;">
                <div class="mec-ad-slot" id="vast-ad-slot" data-zone="video_vast"></div>
                <div id="ad-status" style="color:white; padding:8px; font-size:14px; text-align:center;">Loading Ad...</div>
            </div>

            <button class="ad-btn" id="watch-ad-btn">
                <i class="ph ph-play-circle"></i> Watch Ad to Unlock
            </button>
        </div>
    </div>

    <div class="app-container">

        <!-- Top Bar -->
        <app-topbar data-base="/"></app-topbar>

        <!-- Scrollable body -->
        <main class="main">
            <!-- Hero greeting -->
            <section class="hero">
                <!-- Animated asterisk star -->
                <svg class="hero__star" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true">
                    <path
                        d="M28 4 L30.5 24.5 L50 22 L32 30 L50 38 L30.5 35.5 L28 56 L25.5 35.5 L6 38 L24 30 L6 22 L25.5 24.5 Z"
                        fill="#c0392b" opacity="0.92" />
                </svg>

                <h1 class="hero__title">
                    Ready to ace<br>
                    <em>your exams today?</em>
                </h1>
            </section>

            <!-- Chat Container -->
            <section class="chat-container" id="chat-container">
                <!-- Messages injected here -->
            </section>

            <!-- Input + chips -->
            <section class="input-section" id="input-section">

                <!-- Chat input card -->
                <div class="input-card">
                    <textarea id="chat-input" class="input-textarea" placeholder="Message AI Tutor..." rows="1"
                        aria-label="Chat with AI tutor"></textarea>

                    <div class="input-toolbar">
                        <!-- Attach -->
                        <button class="toolbar-btn" aria-label="Attach file">
                            <i class="ph ph-plus"></i>
                        </button>

                        <span class="toolbar-sep"></span>

                        <!-- Model selector -->
                        <button class="toolbar-btn" aria-label="Select AI model" id="model-selector-btn">
                            <span class="toolbar-model-name">MyExam AI Tutor</span>
                            <i class="ph ph-caret-down"></i>
                        </button>

                        <div class="toolbar-spacer"></div>

                        <!-- Mic / Voice -->
                        <button class="toolbar-icon-btn" id="mic-btn" aria-label="Voice input">
                            <i class="ph ph-microphone"></i>
                        </button>

                        <!-- Send Button -->
                        <button class="toolbar-icon-btn" id="send-btn" aria-label="Send message">
                            <i class="ph ph-paper-plane-right"></i>
                        </button>
                    </div>
                </div>

                <!-- Quick-action chips -->
                <div class="chips" role="list" id="quick-chips">
                    <!-- Injected dynamically based on performance -->
                </div>

            </section>
        </main>
    </div><!-- /.app-container -->

    <script defer src="../../../components/topbar.js"></script>
    <script defer src="../../../components/nav.js"></script>
    <script defer src="../../../components/sidebar.js?v=6"></script>
    <script defer src="../../../components/ad_manager.js"></script>
    <script>
        const textarea = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const chatContainer = document.getElementById('chat-container');
        const heroSection = document.querySelector('.hero');
        const quickChips = document.getElementById('quick-chips');

        // --- TOKEN LOGIC ---
        function checkToken() {
            const tokenExpiry = localStorage.getItem('ai_tutor_token_expiry');
            const now = Date.now();
            if (!tokenExpiry || now > parseInt(tokenExpiry)) {
                document.getElementById('ad-modal').classList.add('active');
                textarea.disabled = true;
                sendBtn.disabled = true;
            } else {
                document.getElementById('ad-modal').classList.remove('active');
                textarea.disabled = false;
                sendBtn.disabled = false;
            }
        }
        
        // Initial token check
        checkToken();
        setInterval(checkToken, 60000); // Re-check every minute

        // VAST Player via Hilltop / MECAdManager
        document.getElementById('watch-ad-btn').addEventListener('click', function() {
            this.style.display = 'none';
            const vidContainer = document.getElementById('vast-video-container');
            vidContainer.style.display = 'block';
            
            // Inject the Hilltop Ad
            const slot = document.getElementById('vast-ad-slot');
            if (window.MECAdManager) {
                window.MECAdManager.injectSlot(slot);
            }
            
            const adStatus = document.getElementById('ad-status');
            adStatus.innerText = "Ad is playing... Please wait 15 seconds to unlock.";

            let remaining = 15;
            const timer = setInterval(() => {
                remaining--;
                if (remaining > 0) {
                    adStatus.innerText = `Ad closes in ${remaining}s`;
                } else {
                    clearInterval(timer);
                    // Grant 1 hour token
                    localStorage.setItem('ai_tutor_token_expiry', Date.now() + (60 * 60 * 1000));
                    checkToken();
                    vidContainer.style.display = 'none';
                    this.style.display = 'flex';
                    setPrompt('Hello! I have unlocked my premium hour.');
                }
            }, 1000);
        });

        // State parsing
        let examState = null;
        let weakTopics = [];
        let examContextString = "No recent exam data found.";
        
        try { 
            // Load cbt_result instead of state
            examState = JSON.parse(localStorage.getItem('cbt_result')); 
            if (examState && examState.questions) {
                const topicScores = {};
                examState.questions.forEach((q, i) => {
                    const t = q.topic || 'General Concepts';
                    if (!topicScores[t]) topicScores[t] = { correct: 0, total: 0 };
                    topicScores[t].total++;
                    
                    let isCorrect = false;
                    if (q.isGridIn) {
                        const ua = (examState.answers[i]||'').toString().trim().toLowerCase();
                        const ca = (q.correctAnswer||'').toString().trim().toLowerCase();
                        if (ua === ca && ua !== '') isCorrect = true;
                    } else {
                        if (examState.answers[i] == q.correct) isCorrect = true;
                    }
                    if (isCorrect) topicScores[t].correct++;
                });
                
                for (let t in topicScores) {
                    weakTopics.push({ topic: t, score: (topicScores[t].correct / topicScores[t].total)*100 });
                }
                weakTopics.sort((a,b) => a.score - b.score);
                
                // Build context string for Mistral
                examContextString = `Student recently took an exam: ${examState.title || 'Practice Exam'}\n` +
                                    `Total Score: ${examState.totalScore} / ${examState.maxScore}\n` +
                                    `Weakest Topics: ${weakTopics.slice(0, 3).map(w => w.topic + ' ('+Math.round(w.score)+'%)').join(', ')}`;
            }
        } catch(e) {}

        // 1. Dynamic Greeting & Gamification
        const h = new Date().getHours();
        let phrase = 'Ready to ace';
        if (h >= 5 && h < 12) phrase = "Good morning! Let's study";
        if (h >= 12 && h < 17) phrase = "Good afternoon. Time to study";
        if (h >= 17 && h < 21) phrase = "Clocking in for the evening shift.";
        if (h >= 21 || h < 5) phrase = "Burning the midnight oil?";
        
        let subText = 'your exams today.';
        if (weakTopics.length > 0 && weakTopics[0].score < 50) {
            subText = `Let's tackle your weakest spot: <strong>${weakTopics[0].topic}</strong>.`;
        } else if (weakTopics.length > 0) {
            subText = `You're doing great! Let's aim for 100% next time.`;
        }
        document.querySelector('.hero__title').innerHTML = phrase + '<br><em>' + subText + '</em>';

        // 2. Dynamic 20 Features Chips
        const allFeatures = [
            { t: 'Interactive Quiz', p: 'Give me a short interactive quiz with 3 multiple-choice questions about [TOPIC]', i: 'ph-graduation-cap' },
            { t: 'Socratic Tutor', p: 'Help me understand [TOPIC] using the Socratic method. Ask me guiding questions.', i: 'ph-brain' },
            { t: 'Explain Like I\'m 5', p: 'Explain [TOPIC] as if I am a 5-year-old using simple analogies.', i: 'ph-baby' },
            { t: 'Study Schedule', p: 'Generate a 3-day study plan for [TOPIC] in a clean markdown table.', i: 'ph-calendar-check' },
            { t: 'Math/Physics Formula', p: 'Give me the most important formulas for [TOPIC] and explain them.', i: 'ph-math-operations' },
            { t: 'Mermaid Flowchart', p: 'Generate a mermaid.js flowchart summarizing [TOPIC].', i: 'ph-tree-structure' },
            { t: 'Flashcards', p: 'Create 5 flashcards for [TOPIC]. Format them clearly.', i: 'ph-cards' },
            { t: 'Mnemonic Creator', p: 'Create a catchy acronym or mnemonic to help me remember the key points of [TOPIC].', i: 'ph-lightbulb' },
            { t: 'Essay Grading', p: 'I want to paste an essay on [TOPIC]. Can you grade it and give feedback?', i: 'ph-pencil-line' },
            { t: 'Topic Summary', p: 'Summarize the most important aspects of [TOPIC] in bullet points.', i: 'ph-list-bullets' },
            { t: 'Past Question', p: 'Give me an example of a past exam question related to [TOPIC].', i: 'ph-file-text' },
            { t: 'Weakness Target', p: 'Let\'s review my weakest topics and do a focused study session.', i: 'ph-target' },
            { t: 'Exam Timer Mock', p: 'Run a timed rapid-fire question session on [TOPIC] (1 minute per question).', i: 'ph-timer' },
            { t: 'Motivation', p: 'I am feeling overwhelmed with studying. Give me some motivation.', i: 'ph-sparkle' },
            { t: 'Daily Challenge', p: 'Give me a challenging "Question of the Day" for [TOPIC].', i: 'ph-trophy' },
            { t: 'Voice Dictation Mode', p: 'I will speak my answers. Please analyze my spoken response on [TOPIC].', i: 'ph-microphone-stage' },
            { t: 'Read Aloud Format', p: 'Explain [TOPIC] in a highly conversational format suitable for text-to-speech.', i: 'ph-speaker-high' },
            { t: 'Pomodoro Study', p: 'Help me run a Pomodoro session. Give me material to read for 25 minutes.', i: 'ph-clock-countdown' },
            { t: 'Export Note Prep', p: 'Generate a comprehensive cheat sheet for [TOPIC] that I can export to PDF.', i: 'ph-file-pdf' },
            { t: 'Exam Strategies', p: 'What are the best test-taking strategies for multiple-choice questions?', i: 'ph-strategy' }
        ];

        let displayTopic = weakTopics.length > 0 ? weakTopics[0].topic : 'General Concepts';
        
        // Pick 4 random features
        const shuffled = allFeatures.sort(() => 0.5 - Math.random());
        const selectedFeatures = shuffled.slice(0, 4);

        quickChips.innerHTML = selectedFeatures.map(f => {
            let prompt = f.p.replace('[TOPIC]', displayTopic);
            // Escape quotes
            prompt = prompt.replace(/'/g, "\\'");
            return `<button class="chip" onclick="setPrompt('${prompt}')"><i class="ph ${f.i}"></i> ${f.t}</button>`;
        }).join('');


        /* -- Auto-grow & Send -- */
        textarea.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        textarea.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
        sendBtn.addEventListener('click', handleSend);

        function setPrompt(text) {
            textarea.value = text;
            textarea.focus();
            handleSend();
        }

        const urlParams = new URLSearchParams(window.location.search);
        const urlPrompt = urlParams.get('prompt');
        const initialPrompt = urlPrompt || localStorage.getItem('ai_initial_prompt');
        if (initialPrompt) {
            setPrompt(initialPrompt);
            localStorage.removeItem('ai_initial_prompt');
            if (urlPrompt) window.history.replaceState({}, document.title, window.location.pathname);
        }

        let isTyping = false;
        let chatHistory = [];

        function handleSend() {
            const text = textarea.value.trim();
            if (!text || isTyping) return;
            
            textarea.value = '';
            textarea.style.height = 'auto';
            
            heroSection.style.display = 'none';
            quickChips.style.display = 'none'; // Hide the hints when chat starts
            chatContainer.classList.add('active');
            
            addMessage(text, 'user');
            
            chatHistory.push({ role: "user", content: text });
            
            isTyping = true;
            const typingId = showTyping();
            
            // Call the real Mistral API endpoint
            generateAIResponse(typingId);
        }

        function addMessage(text, sender) {
            heroSection.style.display = 'none';
            chatContainer.classList.add('active');
            const msg = document.createElement('div');
            msg.className = `chat-msg ${sender}`;
            
            let content = text;
            if (sender === 'ai') {
                // Pre-process custom QUIZ blocks before markdown
                // Expected format: [QUIZ] Question | OptA | OptB | OptC | OptD | CorrectIndex [/QUIZ]
                content = text.replace(/\[QUIZ\]([\s\S]*?)\[\/QUIZ\]/g, function(match, quizContent) {
                    const parts = quizContent.split('|').map(s => s.trim());
                    if (parts.length >= 6) {
                        const question = parts[0];
                        const opts = [parts[1], parts[2], parts[3], parts[4]];
                        const correctIdx = parseInt(parts[5]);
                        let html = `<div style="background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:16px; margin:16px 0;">`;
                        html += `<strong>${question}</strong><div style="margin-top:12px;">`;
                        opts.forEach((opt, idx) => {
                            html += `<button class="quiz-btn" onclick="handleQuizAnswer(this, ${idx}, ${correctIdx})">${opt}</button>`;
                        });
                        html += `</div></div>`;
                        return html;
                    }
                    return match;
                });
                
                content = marked.parse(content);
            }
            
            msg.innerHTML = `
                <div class="chat-avatar">${sender === 'user' ? 'U' : '<i class="ph ph-robot"></i>'}</div>
                <div class="chat-bubble">${content}</div>
            `;
            chatContainer.appendChild(msg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Global function to handle inline quiz buttons
        window.handleQuizAnswer = function(btn, selectedIdx, correctIdx) {
            const container = btn.parentElement;
            const buttons = container.querySelectorAll('.quiz-btn');
            buttons.forEach(b => b.disabled = true); // lock answers
            
            if (selectedIdx === correctIdx) {
                btn.classList.add('correct');
            } else {
                btn.classList.add('wrong');
                buttons[correctIdx].classList.add('correct');
            }
        };

        function showTyping() {
            const id = 'typing-' + Date.now();
            const msg = document.createElement('div');
            msg.className = `chat-msg ai`;
            msg.id = id;
            msg.innerHTML = `
                <div class="chat-avatar"><i class="ph ph-robot"></i></div>
                <div class="chat-bubble">
                    <div class="typing">
                        <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(msg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        /* -- TRUE MISTRAL AI ENGINE -- */
        async function generateAIResponse(typingId) {
            try {
                // Ensure the AI knows to format quizzes
                const sysPromptEnhancement = `\n\nCRITICAL SYSTEM INSTRUCTION: If giving a multiple choice quiz, strictly use this format: [QUIZ] Question Text | Option 0 | Option 1 | Option 2 | Option 3 | CorrectOptionIndex [/QUIZ]. For example: [QUIZ] What is 2+2? | 3 | 4 | 5 | 6 | 1 [/QUIZ]. Do not use standard markdown for quizzes.`;
                
                const sb = MECSupabase.getSupabase();
                const { data, error } = await sb.functions.invoke('chat-agent', {
                    body: {
                        messages: chatHistory,
                        examContext: examContextString + sysPromptEnhancement
                    }
                });

                document.getElementById(typingId).remove();
                isTyping = false;

                if (error) {
                    let errDetails = error.message;
                    if (error.context && typeof error.context.json === 'function') {
                        try {
                            const errBody = await error.context.json();
                            errDetails = errBody.error || JSON.stringify(errBody);
                        } catch (e) {}
                    }
                    console.error("AI chat-agent Error Details:", errDetails);
                    addMessage("Oops! " + (errDetails || "My connection to the server dropped."), 'ai');
                    return;
                }

                if (data && data.text) {
                    chatHistory.push({ role: "assistant", content: data.text });
                    addMessage(data.text, 'ai');
                } else {
                    addMessage("I'm sorry, I couldn't formulate a response right now.", 'ai');
                }
            } catch (err) {
                document.getElementById(typingId)?.remove();
                isTyping = false;
                addMessage("Oops! Network error. Make sure you are connected to the internet.", 'ai');
                console.error(err);
            }
        }

        /* -- Mic toggle -- */
        document.getElementById('mic-btn').addEventListener('click', function () {
            this.classList.toggle('active');
            const icon = this.querySelector('i');
            if (this.classList.contains('active')) {
                icon.className = 'ph-fill ph-microphone';
                this.style.color = 'var(--accent)';
            } else {
                icon.className = 'ph ph-microphone';
                this.style.color = '';
            }
        });
    </script>
</body>

</html>
