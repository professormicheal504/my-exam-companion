<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Arena Hub</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../components/topbar.css">
  <link rel="stylesheet" href="../../../components/sidebar.css?v=5">
    
    <style>
        :root {
            /* Light Theme with Website Red Accent */
            --primary: #b70c01;
            --primary-light: #fff0f0;
            --primary-dark: #960a01;
            
            --success: #10B981;
            --text-main: #0f172a;
            --text-muted: #64748b;
            
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-hover: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            /* Subtle background pattern */
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px 40px;
        }

        /* ─── HEADER ─── */
        .hub-header {
            padding: 32px 0 24px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 32px;
        }

        .header-title-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .back-btn {
            background: none; border: none; cursor: pointer;
            color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px;
            font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 14px;
            margin-bottom: 12px; transition: color 0.2s;
        }
        .back-btn:hover { color: var(--primary); }

        .hub-title {
            font-family: 'Outfit', sans-serif;
            font-size: 32px;
            font-weight: 800;
            color: var(--text-main);
            display: flex; align-items: center; gap: 10px;
        }
        
        .live-icon-lg {
            width: 14px; height: 14px;
            background: var(--primary);
            border-radius: 50%;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0% { box-shadow: 0 0 0 0 rgba(183, 12, 1, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(183, 12, 1, 0); }
            100% { box-shadow: 0 0 0 0 rgba(183, 12, 1, 0); }
        }

        .online-count {
            display: flex; align-items: center; gap: 6px;
            background: #f1f5f9; padding: 6px 12px; border-radius: 99px;
            font-size: 14px; font-weight: 600; color: var(--text-muted);
            border: 1px solid var(--border-color);
        }
        .online-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; }

        /* ─── GRID ─── */
        .subjects-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 768px) {
            .subjects-grid { grid-template-columns: 1fr 1fr; }
        }

        /* ─── CARD DESIGN ─── */
        .subject-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Animation base */
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFade 0.5s forwards;
        }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        .subject-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: #cbd5e1;
        }

        /* Card Header (Icon + Name) */
        .card-header {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .subject-icon {
            width: 52px; height: 52px;
            border-radius: 14px;
            background: #f8fafc;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            border: 1px solid var(--border-color);
        }

        .subject-name {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Status Area */
        .card-status {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #f1f5f9;
        }

        .status-badge {
            display: inline-flex; align-items: center; gap: 6px;
            font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        
        .status-live { color: var(--primary); }
        .status-upcoming { color: #d97706; } /* Amber */
        .status-ended { color: var(--text-muted); }

        .live-dot {
            width: 8px; height: 8px; background: var(--primary); border-radius: 50%;
            animation: pulse-dot 1.5s infinite;
        }

        .status-detail { font-size: 14px; color: var(--text-main); font-weight: 500; }
        .status-players { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

        /* Actions */
        .card-actions { margin-top: auto; }
        
        .btn {
            width: 100%; padding: 14px; border-radius: 12px;
            font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 700;
            cursor: pointer; border: none; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        .btn-live {
            background: var(--primary); color: white;
            box-shadow: 0 4px 12px rgba(183, 12, 1, 0.25);
        }
        .btn-live:hover { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-live:active { transform: translateY(1px); }

        .btn-upcoming {
            background: white; color: var(--text-main);
            border: 2px solid var(--border-color);
        }
        .btn-upcoming:hover { background: #f8fafc; border-color: #cbd5e1; }
        .btn-upcoming.subscribed {
            background: var(--success-light); border-color: var(--success); color: var(--success);
        }

        .btn-ended {
            background: #f1f5f9; color: var(--text-muted);
            pointer-events: none; /* Disabled for demo */
        }

        /* Specific styling for Live Cards */
        .subject-card.is-live {
            border: 2px solid var(--primary-light);
            background: linear-gradient(to bottom right, #ffffff, #fffafa);
        }
        .subject-card.is-live .subject-icon {
            background: var(--primary-light);
            border-color: rgba(183, 12, 1, 0.2);
            color: var(--primary);
        }
        .subject-card.is-live .card-status {
            background: white; border-color: var(--primary-light);
        }

        /* ─── FILTERS ─── */
        .filter-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 32px;
        }

        @media (min-width: 768px) {
            .filter-section { flex-direction: row; align-items: center; justify-content: space-between; }
        }

        .search-bar {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-bar input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }
        .search-bar input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }

        .search-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); pointer-events: none;
        }

        .filter-chips {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
            scrollbar-width: none;
        }
        .filter-chips::-webkit-scrollbar { display: none; }

        .chip {
            padding: 8px 16px;
            border-radius: 99px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-muted);
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .chip:hover { background: #f1f5f9; color: var(--text-main); }
        .chip.active { background: var(--text-main); color: white; border-color: var(--text-main); }

    </style>
</head>
<body>

<app-sidebar data-base="../../../"></app-sidebar>
<div class="main-wrapper">
    <app-topbar data-base="../../../"></app-topbar>

    <div class="container">
    <header class="hub-header">
        <div class="header-title-group">
            <h1 class="hub-title">
                <div class="live-icon-lg"></div> Live Arena
            </h1>
        </div>
        <div class="online-count">
            <div class="online-dot"></div> <span id="total-online">0</span> Online
        </div>
    </header>

    <div class="filter-section">
        <div class="search-bar">
            <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="search-input" placeholder="Search for a subject...">
        </div>
        <div class="filter-chips">
            <button class="chip active" data-filter="all">All</button>
            <button class="chip" data-filter="live">Live Now</button>
            <button class="chip" data-filter="upcoming">Upcoming</button>
            <button class="chip" data-filter="ended">Ended</button>
        </div>
    </div>

    <main class="subjects-grid" id="grid">
        <!-- Cards rendered by JS -->
    </main>
</div>

<script>
    // --- Mock Data ---
    // Ranked logically: Live first, Upcoming next, Ended last.
    const SUBJECTS = [
        {
            id: 'eng',
            name: 'English Language',
            icon: '📚',
            status: 'live',
            progress: 'Question 4 of 20',
            players: 142
        },
        {
            id: 'gov',
            name: 'Government',
            icon: '🏛️',
            status: 'live',
            progress: 'Question 12 of 20',
            players: 86
        },
        {
            id: 'bio',
            name: 'Biology',
            icon: '🧬',
            status: 'upcoming',
            time: 'Starting in 5 min',
            players: 45 // waiting
        },
        {
            id: 'math',
            name: 'Mathematics',
            icon: '📐',
            status: 'upcoming',
            time: 'Starting in 45 min',
            players: 12
        },
        {
            id: 'chem',
            name: 'Chemistry',
            icon: '🧪',
            status: 'ended',
            detail: 'Ended 2 hours ago',
            players: 110 // total played
        }
    ];

    const grid = document.getElementById('grid');

    // Calculate total online
    const totalOnline = SUBJECTS.reduce((acc, curr) => acc + (curr.status === 'live' ? curr.players : 0), 0) + Math.floor(Math.random() * 50);
    document.getElementById('total-online').textContent = totalOnline;

    let currentFilter = 'all';
    let searchQuery = '';

    function renderCards() {
        grid.innerHTML = '';
        
        const filtered = SUBJECTS.filter(sub => {
            const matchesSearch = sub.name.toLowerCase().includes(searchQuery.toLowerCase());
            const matchesFilter = currentFilter === 'all' || sub.status === currentFilter;
            return matchesSearch && matchesFilter;
        });

        if(filtered.length === 0) {
            grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 40px; color: var(--text-muted);">No subjects found matching your criteria.</div>`;
            return;
        }

        filtered.forEach((sub, index) => {
            const card = document.createElement('div');
            // Add specific class for live
            card.className = `subject-card ${sub.status === 'live' ? 'is-live' : ''}`;
            
            // Staggered entrance animation (0.1s delay per card)
            card.style.animationDelay = `${index * 0.1}s`;

            let statusHtml = '';
            let btnHtml = '';

            if (sub.status === 'live') {
                statusHtml = `
                    <div class="status-badge status-live"><div class="live-dot"></div> Live Now</div>
                    <div class="status-detail">${sub.progress}</div>
                    <div class="status-players">${sub.players} playing</div>
                `;
                btnHtml = `<button class="btn btn-live" onclick="joinLive('${sub.id}', event)">Join Round 🚀</button>`;
            } 
            else if (sub.status === 'upcoming') {
                statusHtml = `
                    <div class="status-badge status-upcoming">🕒 Upcoming</div>
                    <div class="status-detail">${sub.time}</div>
                    <div class="status-players">${sub.players} waiting</div>
                `;
                btnHtml = `<button class="btn btn-upcoming" id="btn-${sub.id}" onclick="toggleNotify('${sub.id}', event)">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    Notify Me
                </button>`;
            } 
            else if (sub.status === 'ended') {
                statusHtml = `
                    <div class="status-badge status-ended">🏁 Ended</div>
                    <div class="status-detail">${sub.detail}</div>
                    <div class="status-players">${sub.players} played</div>
                `;
                btnHtml = `<button class="btn btn-ended">View Recap</button>`;
            }

            card.innerHTML = `
                <div class="card-header">
                    <div class="subject-icon">${sub.icon}</div>
                    <h2 class="subject-name">${sub.name}</h2>
                </div>
                <div class="card-status">
                    ${statusHtml}
                </div>
                <div class="card-actions">
                    ${btnHtml}
                </div>
            `;

            grid.appendChild(card);
        });
    }

    // --- Listeners ---
    document.getElementById('search-input').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderCards();
    });

    document.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', (e) => {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            e.target.classList.add('active');
            currentFilter = e.target.getAttribute('data-filter');
            renderCards();
        });
    });

    // Initial render
    renderCards();

    // --- Interactions ---

    function joinLive(subjectId, event) {
        // Simple state swap before navigating
        const btn = event.currentTarget;
        const originalText = btn.innerHTML;
        btn.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" class="spin"><circle cx="12" cy="12" r="10"></circle><path d="M12 2v4"></path></svg> Entering...`;
        
        // Navigate to the instructions screen
        setTimeout(() => {
            window.location.href = 'instruction.html';
        }, 600);
    }

    function toggleNotify(subjectId, event) {
        const btn = document.getElementById(`btn-${subjectId}`);
        const isSubbed = btn.classList.contains('subscribed');
        
        if (isSubbed) {
            btn.classList.remove('subscribed');
            btn.innerHTML = `
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                Notify Me
            `;
        } else {
            btn.classList.add('subscribed');
            btn.innerHTML = `
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
                Subscribed!
            `;
        }
    }

</script>

<style>
    /* Utility for spinner */
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
</style>

</div> <!-- End main-wrapper -->
<script src="../../../components/topbar.js"></script>
  <script src="../../../components/sidebar.js?v=6"></script>
</body>
</html>
