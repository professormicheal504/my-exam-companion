<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Secondary School Classes – My Exam Companion</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../components/topbar.css">
  <link rel="stylesheet" href="../../../components/sidebar.css?v=4">
  <style>
    /* Reset & Global */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-family: 'Inter', sans-serif; background: #f7f7f8; color: #131212; scroll-behavior: smooth; }
    body { min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; outline: none; background: none; }

    /* App Shell */
    .app { display: flex; min-height: 100vh; }
    .main-wrapper { margin-left: 90px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
    @media (max-width: 768px) { .main-wrapper { margin-left: 80px; } }
    @media (max-width: 600px) { .main-wrapper { margin-left: 0; } }

    .content-area { padding: 32px 24px; flex: 1; max-width: 1200px; margin: 0 auto; width: 100%; }

    /* Header Section */
    .page-header {
      margin-bottom: 32px; display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap;
    }
    .page-title {
      font-size: 28px; font-weight: 800; color: #131212; letter-spacing: -0.02em; margin-bottom: 8px;
    }
    .page-desc {
      font-size: 15px; color: #4b5563; max-width: 600px; line-height: 1.6;
    }

    /* Actions */
    .btn-primary {
      background: #2563eb; color: white; padding: 12px 24px; border-radius: 12px;
      font-size: 14.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px;
      transition: all 0.2s; box-shadow: 0 4px 12px rgba(183, 12, 1, 0.2);
    }
    .btn-primary:hover {
      background: #1d4ed8; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(183, 12, 1, 0.3);
    }

    /* Grid */
    .class-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; margin-bottom: 40px;
    }

    .section-title {
      font-size: 20px; font-weight: 800; color: #111827; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
    }

    /* Class Cards */
    .class-card {
      background: white; border-radius: 16px; border: 1px solid #ebebeb; padding: 24px;
      display: flex; flex-direction: column; transition: all 0.2s; position: relative; overflow: hidden;
    }
    .class-card:hover {
      transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.06); border-color: #e5e7eb;
    }
    
    .class-icon {
      width: 56px; height: 56px; border-radius: 14px; background: #eff6ff; border: 1px solid #bfdbfe;
      display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 16px; color: #1d4ed8;
    }
    .class-name {
      font-size: 20px; font-weight: 800; color: #111827; margin-bottom: 8px; letter-spacing: -0.01em; line-height: 1.3;
    }
    .class-meta {
      font-size: 13.5px; color: #6b7280; display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;
    }
    .class-meta span { display: flex; align-items: center; gap: 8px; }
    
    /* Tag */
    .category-tag {
      position: absolute; top: 24px; right: 24px; background: #f3f4f6; color: #4b5563;
      padding: 6px 12px; border-radius: 99px; font-size: 11px; font-weight: 800;
      display: flex; align-items: center; gap: 4px; letter-spacing: 0.05em; border: 1px solid #e5e7eb; text-transform: uppercase;
    }

    .card-footer {
      margin-top: auto; border-top: 1px solid #f3f4f6; padding-top: 20px; display: flex; gap: 12px;
    }
    .card-footer .btn-primary { flex: 1; justify-content: center; padding: 10px 16px; font-size: 13.5px; }

  </style>
</head>
<body>

  <div class="app">
    <!-- LEFT SIDEBAR -->
    <app-sidebar data-base="../../../" data-active="secondary_school"></app-sidebar>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
      <app-topbar data-base="../../../"></app-topbar>

      <main class="content-area">
        
        <div class="page-header">
          <div>
            <h1 class="page-title">Secondary School Classes</h1>
            <p class="page-desc">Select your current class to access termly exams, continuous assessments, and curriculum-based CBT practices.</p>
          </div>
        </div>

        <h2 class="section-title"><span style="font-size: 24px;">🎒</span> Junior Secondary School (JSS)</h2>
        <div class="class-grid" id="jssGrid">
          <!-- JSS Cards generated by JS -->
        </div>

        <h2 class="section-title"><span style="font-size: 24px;">🎓</span> Senior Secondary School (SSS)</h2>
        <div class="class-grid" id="sssGrid">
          <!-- SSS Cards generated by JS -->
        </div>

      </main>
    </div>
  </div>

  <script defer src="../../../components/nav.js"></script>
<script defer src="../../../components/sidebar.js"></script>
  <script defer src="../../../components/topbar.js"></script>
  <script>
    const jssClasses = [
      { id: 'jss1', name: 'J.S.S 1', desc: 'Junior Secondary School 1', subjects: 12, terms: '1st, 2nd & 3rd Term' },
      { id: 'jss2', name: 'J.S.S 2', desc: 'Junior Secondary School 2', subjects: 12, terms: '1st, 2nd & 3rd Term' },
      { id: 'jss3', name: 'J.S.S 3 (BECE)', desc: 'Junior Secondary School 3', subjects: 15, terms: 'BECE / Junior WAEC' }
    ];

    const sssClasses = [
      { id: 'ss1', name: 'S.S 1', desc: 'Senior Secondary School 1', subjects: 18, terms: '1st, 2nd & 3rd Term' },
      { id: 'ss2', name: 'S.S 2', desc: 'Senior Secondary School 2', subjects: 18, terms: '1st, 2nd & 3rd Term' },
      { id: 'ss3', name: 'S.S 3 (WASSCE)', desc: 'Senior Secondary School 3', subjects: 20, terms: 'WASSCE / NECO Prep' }
    ];

    function renderGrid(list, containerId) {
      const grid = document.getElementById(containerId);
      grid.innerHTML = '';
      
      list.forEach(cls => {
        const card = document.createElement('div');
        card.className = 'class-card';
        card.innerHTML = `
          <div class="category-tag">
            CBT & THEORY
          </div>
          <div class="class-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          </div>
          <h3 class="class-name">${cls.name}</h3>
          <div class="class-meta">
            <span style="font-weight: 600; color: #374151;">${cls.desc}</span>
            <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg> ${cls.subjects} Subjects Available</span>
            <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> ${cls.terms}</span>
          </div>
          <div class="card-footer">
            <button class="btn-primary" onclick="window.location.href='subjects.html?class=${cls.id}'">Select Class</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Initialize
    renderGrid(jssClasses, 'jssGrid');
    renderGrid(sssClasses, 'sssGrid');
  </script>
</body>
</html>
