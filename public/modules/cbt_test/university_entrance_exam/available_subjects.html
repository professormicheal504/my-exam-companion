<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Available Subjects – My Exam Companion</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../components/topbar.css">
  <link rel="stylesheet" href="../../../components/sidebar.css?v=4">
  <style>
    /* Reset & Global */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-family: 'Inter', sans-serif; background: #f7f7f8; color: #131212; scroll-behavior: smooth; }
    body { min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; outline: none; background: none; }

    /* App Shell */
    .app { display: flex; min-height: 100vh; }
    .main-wrapper { margin-left: 90px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
    @media (max-width: 768px) { .main-wrapper { margin-left: 80px; } }
    @media (max-width: 600px) { .main-wrapper { margin-left: 0; } }

    .content-area { padding: 32px 24px; flex: 1; max-width: 1200px; margin: 0 auto; width: 100%; }

    /* Back Link */
    .back-link {
      display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 600; color: #4b5563; margin-bottom: 24px; transition: color 0.2s;
    }
    .back-link:hover { color: #111827; }

    /* Header Section */
    .page-header {
      margin-bottom: 32px; display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap;
    }
    .page-title {
      font-size: 28px; font-weight: 800; color: #131212; letter-spacing: -0.02em; margin-bottom: 8px; display: flex; align-items: center; gap: 12px;
    }
    .page-desc {
      font-size: 15px; color: #4b5563; max-width: 600px; line-height: 1.6;
    }

    /* Actions */
    .header-actions { display: flex; gap: 12px; }
    .btn-primary {
      background: #2563eb; color: white; padding: 12px 24px; border-radius: 12px;
      font-size: 14.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px;
      transition: all 0.2s; box-shadow: 0 4px 12px rgba(183, 12, 1, 0.2);
    }
    .btn-primary:hover {
      background: #1d4ed8; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(183, 12, 1, 0.3);
    }
    
    .btn-secondary {
      background: white; color: #374151; padding: 12px 24px; border-radius: 12px;
      font-size: 14.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px;
      border: 1px solid #d1d5db; transition: all 0.2s;
    }
    .btn-secondary:hover { background: #f9fafb; border-color: #9ca3af; }

    /* Grid */
    .subject-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px;
    }

    /* Subject Card */
    .subject-card {
      background: white; border-radius: 16px; border: 1px solid #ebebeb; padding: 24px;
      display: flex; flex-direction: column; transition: all 0.2s; position: relative; overflow: hidden;
    }
    .subject-card:hover {
      transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.06); border-color: #e5e7eb;
    }
    
    .subject-icon {
      width: 56px; height: 56px; border-radius: 14px; background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534;
      display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 16px;
    }
    .subject-name {
      font-size: 18px; font-weight: 800; color: #111827; margin-bottom: 8px; letter-spacing: -0.01em; line-height: 1.3;
    }
    .subject-meta {
      font-size: 13.5px; color: #6b7280; display: flex; align-items: center; gap: 12px; margin-bottom: 24px;
    }
    .subject-meta span { display: flex; align-items: center; gap: 4px; }
    
    /* Access Tag */
    .access-tag {
      position: absolute; top: 24px; right: 24px; background: #eff6ff; color: #1d4ed8;
      padding: 6px 12px; border-radius: 99px; font-size: 12px; font-weight: 800;
      display: flex; align-items: center; gap: 4px; letter-spacing: 0.05em; border: 1px solid #bfdbfe; text-transform: uppercase;
    }

    .card-footer {
      margin-top: auto; border-top: 1px solid #f3f4f6; padding-top: 20px; display: flex; gap: 12px;
    }
    .card-footer .btn-secondary { flex: 1; justify-content: center; padding: 10px 16px; font-size: 13.5px; }
    .card-footer .btn-primary { flex: 1; justify-content: center; padding: 10px 16px; font-size: 13.5px; }

    /* Modals */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999;
      display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s;
    }
    .modal-overlay.show { display: flex; opacity: 1; }
    
    .modal-box {
      background: white; width: 100%; max-width: 500px; border-radius: 20px; overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15); transform: translateY(20px); transition: transform 0.3s;
    }
    .modal-overlay.show .modal-box { transform: translateY(0); }
    
    .modal-header {
      padding: 24px; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center;
    }
    .modal-header h3 { font-size: 20px; font-weight: 800; color: #111827; }
    .btn-close { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #f3f4f6; color: #4b5563; border: none; }
    .btn-close:hover { background: #e5e7eb; color: #111827; }
    
    .modal-body { padding: 24px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13.5px; font-weight: 700; color: #374151; margin-bottom: 8px; }
    .form-control {
      width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid #d1d5db; font-size: 14.5px;
      outline: none; transition: border-color 0.2s; font-family: inherit; background: #f9fafb;
    }
    .form-control:focus { border-color: #2563eb; background: white; }
    
    .modal-footer {
      padding: 20px 24px; background: #f9fafb; border-top: 1px solid #f3f4f6; display: flex; justify-content: flex-end; gap: 12px;
    }

    @media (max-width: 600px) {
      .page-header { flex-direction: column; }
      .header-actions { width: 100%; flex-direction: column; }
      .header-actions button { width: 100%; justify-content: center; }
      .card-footer { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- Request Modal -->
  <div id="requestModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Request a Subject</h3>
        <button class="btn-close" onclick="closeRequestModal()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body">
        <div style="background: #ecfdf5; padding: 16px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 12px; border: 1px solid #a7f3d0;">
          <div style="color: #059669; flex-shrink: 0;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4l3 3"></path></svg></div>
          <div>
            <h4 style="color: #065f46; font-size: 14px; font-weight: 700; margin-bottom: 4px;">Free Request</h4>
            <p style="color: #047857; font-size: 13px; line-height: 1.5;">Since you have already unlocked access to this university, requesting any new subject is completely free.</p>
          </div>
        </div>
        <div class="form-group">
          <label>Subject Name</label>
          <input type="text" class="form-control" placeholder="e.g. Accounting, Geography, Literature">
        </div>
        <div class="form-group">
          <label>Any specific topics? (Optional)</label>
          <textarea class="form-control" rows="3" placeholder="Tell us if there are specific areas you want us to focus on..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeRequestModal()">Cancel</button>
        <button class="btn-primary" onclick="submitRequest()">Submit Request</button>
      </div>
    </div>
  </div>

  <div class="app">
    <!-- LEFT SIDEBAR -->
    <app-sidebar data-base="../../../" data-active="university_exam"></app-sidebar>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
      <app-topbar data-base="../../../"></app-topbar>

      <main class="content-area">
        
        <a href="all_university_exam.html" class="back-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Back to Universities
        </a>

        <div class="page-header">
          <div>
            <h1 class="page-title">
              <span id="uni_display_name">Target University</span>
              <span style="font-size: 14px; padding: 4px 10px; background: #ecfdf5; color: #059669; border-radius: 99px; border: 1px solid #a7f3d0; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 800;">Unlocked</span>
            </h1>
            <p class="page-desc">Select a subject to begin your tailored Post-UTME CBT practice. Can't find your subject? Request it for free!</p>
          </div>
          <div class="header-actions">
            <button class="btn-secondary" onclick="openRequestModal()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              Request a Subject (Free)
            </button>
          </div>
        </div>

        <div class="subject-grid" id="subjectGrid">
          <!-- Subject Cards generated by JS -->
        </div>

      </main>
    </div>
  </div>

  <script defer src="../../../components/nav.js"></script>
<script defer src="../../../components/sidebar.js"></script>
  <script defer src="../../../components/topbar.js"></script>
  <script>
    // Get University from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const uniName = urlParams.get('uni') || 'Selected University';
    document.getElementById('uni_display_name').innerText = uniName.toUpperCase() + " Subjects";

    const subjects = [
      { id: 'math', name: 'Mathematics', icon: '➗', questions: 450, time: '40 Mins' },
      { id: 'eng', name: 'Use of English', icon: '📖', questions: 500, time: '45 Mins' },
      { id: 'phy', name: 'Physics', icon: '⚡', questions: 320, time: '35 Mins' },
      { id: 'chem', name: 'Chemistry', icon: '🧪', questions: 340, time: '35 Mins' },
      { id: 'bio', name: 'Biology', icon: '🧬', questions: 410, time: '30 Mins' },
      { id: 'econ', name: 'Economics', icon: '📈', questions: 280, time: '30 Mins' }
    ];

    function renderSubjects() {
      const grid = document.getElementById('subjectGrid');
      grid.innerHTML = '';

      subjects.forEach(sub => {
        const card = document.createElement('div');
        card.className = 'subject-card';
        card.innerHTML = `
          <div class="access-tag">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"></path></svg>
            Unlocked
          </div>
          <div class="subject-icon">${sub.icon}</div>
          <h3 class="subject-name">${sub.name}</h3>
          <div class="subject-meta">
            <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg> ${sub.questions} Qs</span>
            <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> ${sub.time}</span>
          </div>
          <div class="card-footer">
            <button class="btn-secondary" onclick="window.location.href='../core/setup.html'">Practice Mode</button>
            <button class="btn-primary" onclick="window.location.href='../core/cbt_player.html'">Start Exam</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openRequestModal() {
      document.getElementById('requestModal').classList.add('show');
    }

    function closeRequestModal() {
      document.getElementById('requestModal').classList.remove('show');
    }

    function submitRequest() {
      alert('Your request has been submitted successfully! We will notify you when the subject is added.');
      closeRequestModal();
    }

    // Initialize
    renderSubjects();
  </script>
</body>
</html>
