<!DOCTYPE html>
<html lang="en">
<head>
<script>
  /* Anti-flash: apply saved theme before first paint */
  (function() {
    try {
      var t = localStorage.getItem('mec_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch(e) {}
  })();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Available Subjects – My Exam Companion</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../components/topbar.css?v=13">
  <link rel="stylesheet" href="../../../components/dark-mode.css">
  <link rel="stylesheet" href="../../../components/sidebar.css?v=23">
  <style>
    /* Reset & Global */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-family: 'Inter', sans-serif; background: var(--bg-base); color: var(--text-primary); scroll-behavior: smooth; }
    body { min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; outline: none; background: none; }

    /* App Shell */
    .app { display: flex; min-height: 100vh; }
    .main-wrapper { margin-left: 90px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
    @media (max-width: 768px) { .main-wrapper { margin-left: 80px; } }
    @media (max-width: 600px) { .main-wrapper { margin-left: 0; } }

    .content-area { padding: 32px 24px; flex: 1; max-width: 1200px; margin: 0 auto; width: 100%; }

    /* Back Link */
    .back-link {
      display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 24px; transition: color 0.2s;
    }
    .back-link:hover { color: var(--text-primary); }

    /* Header Section */
    .page-header {
      margin-bottom: 32px; display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap;
    }
    .page-title {
      font-size: 28px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.02em; margin-bottom: 8px; display: flex; align-items: center; gap: 12px;
    }
    .page-desc {
      font-size: 15px; color: var(--text-muted); max-width: 600px; line-height: 1.6;
    }

    /* Actions */
    .header-actions { display: flex; gap: 12px; }
    .btn-primary {
      background: #2563eb; color: white; padding: 12px 24px; border-radius: 12px;
      font-size: 14.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px;
      transition: all 0.2s; box-shadow: 0 4px 12px rgba(183, 12, 1, 0.2);
    }
    .btn-primary:hover {
      background: #1d4ed8; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(183, 12, 1, 0.3);
    }
    
    .btn-secondary {
      background: var(--bg-card); color: #374151; padding: 12px 24px; border-radius: 12px;
      font-size: 14.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px;
      border: 1px solid #d1d5db; transition: all 0.2s;
    }
    .btn-secondary:hover { background: var(--bg-base); border-color: var(--text-muted); }

    /* Grid */
    .subject-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px;
    }

    /* Subject Card */
    .subject-card {
      background: linear-gradient(145deg, var(--bg-card), rgba(248, 250, 252, 0.4));
      border-radius: 20px; border: 1px solid rgba(226, 232, 240, 0.8); padding: 24px;
      display: flex; flex-direction: column; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative; overflow: hidden; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.02);
      z-index: 1;
    }
    .subject-card:hover {
      transform: translateY(-6px); box-shadow: 0 20px 40px -4px rgba(0,0,0,0.08);
      border-color: rgba(203, 213, 225, 0.8);
    }
    
    .subject-watermark {
      position: absolute; right: -15%; bottom: -15%; width: 140px; height: 140px;
      opacity: 0.04; color: var(--text-primary); pointer-events: none;
      transform: rotate(-15deg); z-index: -1; transition: all 0.5s ease;
    }
    .subject-card:hover .subject-watermark {
      transform: rotate(0deg) scale(1.1); opacity: 0.06; color: #2563eb;
    }
    .subject-watermark svg { width: 100%; height: 100%; }
    
    .subject-icon {
      width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
      font-size: 26px; margin-bottom: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.04);
      border: 1px solid rgba(255,255,255,0.5);
    }
    .subject-name {
      font-size: 18px; font-weight: 800; color: var(--text-primary); margin-bottom: 8px;
      letter-spacing: -0.01em; line-height: 1.3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; /* Prevent long text */
    }
    .subject-meta {
      font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 12px; margin-bottom: 24px;
      font-weight: 500;
    }
    .subject-meta span { display: flex; align-items: center; gap: 4px; }
    
    /* Access Tag */
    .access-tag {
      position: absolute; top: 20px; right: 20px; background: rgba(239, 246, 255, 0.8); color: #1d4ed8;
      padding: 6px 12px; border-radius: 99px; font-size: 11px; font-weight: 800;
      display: flex; align-items: center; gap: 4px; letter-spacing: 0.05em; border: 1px solid rgba(191, 219, 254, 0.5);
      text-transform: uppercase; backdrop-filter: blur(4px);
    }

    .card-footer {
      margin-top: auto; border-top: 1px solid rgba(243, 244, 246, 0.8); padding-top: 20px; display: flex; gap: 10px;
    }
    .card-footer .btn-secondary { flex: 1; justify-content: center; padding: 10px 14px; font-size: 13px; border-radius: 10px; }
    .card-footer .btn-primary { flex: 1; justify-content: center; padding: 10px 14px; font-size: 13px; border-radius: 10px; }

    /* Modals */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999;
      display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s;
    }
    .modal-overlay.show { display: flex; opacity: 1; }
    
    .modal-box {
      background: var(--bg-card); width: 100%; max-width: 500px; border-radius: 20px; overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15); transform: translateY(20px); transition: transform 0.3s;
    }
    .modal-overlay.show .modal-box { transform: translateY(0); }
    
    .modal-header {
      padding: 24px; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center;
    }
    .modal-header h3 { font-size: 20px; font-weight: 800; color: var(--text-primary); }
    .btn-close { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--bg-base); color: var(--text-muted); border: none; }
    .btn-close:hover { background: #e5e7eb; color: var(--text-primary); }
    
    .modal-body { padding: 24px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13.5px; font-weight: 700; color: #374151; margin-bottom: 8px; }
    .form-control {
      width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid #d1d5db; font-size: 14.5px;
      outline: none; transition: border-color 0.2s; font-family: inherit; background: var(--bg-base);
    }
    .form-control:focus { border-color: #2563eb; background: var(--bg-card); }
    
    .modal-footer {
      padding: 20px 24px; background: var(--bg-base); border-top: 1px solid #f3f4f6; display: flex; justify-content: flex-end; gap: 12px;
    }

    @media (max-width: 600px) {
      .page-header { flex-direction: column; }
      .header-actions { width: 100%; flex-direction: column; }
      .header-actions button { width: 100%; justify-content: center; }
      .card-footer { flex-direction: column; }
    }
  </style>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CHG6831RHH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-CHG6831RHH');
  </script>
</head>
<body>

  <!-- Request Modal -->
  <div id="requestModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Request a Subject</h3>
        <button class="btn-close" onclick="closeRequestModal()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body">
        <div style="background: #ecfdf5; padding: 16px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 12px; border: 1px solid #a7f3d0;">
          <div style="color: #059669; flex-shrink: 0;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4l3 3"></path></svg></div>
          <div>
            <h4 style="color: #065f46; font-size: 14px; font-weight: 700; margin-bottom: 4px;">Free Request</h4>
            <p style="color: #047857; font-size: 13px; line-height: 1.5;">Since you have already unlocked access to this university, requesting any new subject is completely free.</p>
          </div>
        </div>
        <div class="form-group">
          <label>Subject Name</label>
          <input type="text" class="form-control" placeholder="e.g. Accounting, Geography, Literature">
        </div>
        <div class="form-group">
          <label>Any specific topics? (Optional)</label>
          <textarea class="form-control" rows="3" placeholder="Tell us if there are specific areas you want us to focus on..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeRequestModal()">Cancel</button>
        <button class="btn-primary" onclick="submitRequest()">Submit Request</button>
      </div>
    </div>
  </div>

  <div class="app">
    <!-- LEFT SIDEBAR -->
    <app-sidebar data-base="../../../" data-active="university_exam"></app-sidebar>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
      <app-topbar data-base="../../../"></app-topbar>

      <main class="content-area">
        
        <a href="all_university_exam.html" class="back-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Back to Universities
        </a>

        <div class="page-header">
          <div>
            <h1 class="page-title">
              <span id="uni_display_name">Target University</span>
              <span style="font-size: 14px; padding: 4px 10px; background: #ecfdf5; color: #059669; border-radius: 99px; border: 1px solid #a7f3d0; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 800;">Unlocked</span>
            </h1>
            <p class="page-desc">Select a subject to begin your tailored Post-UTME CBT practice. Can't find your subject? Request it for free!</p>
          </div>
          <div class="header-actions">
            <button class="btn-secondary" onclick="openRequestModal()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              Request a Subject (Free)
            </button>
          </div>
        </div>

        <div class="subject-grid" id="subjectGrid">
          <!-- Subject Cards generated by JS -->
        </div>

      </main>
    </div>
  </div>

  <script defer src="../../../components/nav.js"></script>
<script defer src="../../../components/sidebar.js"></script>
  <script defer src="../../../components/topbar.js?v=4"></script>
  <script>
    // Get University from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const uniName = urlParams.get('uni') || 'Selected University';
    document.getElementById('uni_display_name').innerText = uniName.toUpperCase() + " Subjects";

    const subjects = [
      { id: 'math', name: 'Mathematics', icon: '➗', questions: 450, time: '40 Mins', color: 'rgba(239, 246, 255, 1)', borderColor: 'rgba(191, 219, 254, 1)',
        svg: '<circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/>' },
      { id: 'eng', name: 'Use of English', icon: '📖', questions: 500, time: '45 Mins', color: 'rgba(254, 242, 242, 1)', borderColor: 'rgba(254, 202, 202, 1)',
        svg: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>' },
      { id: 'phy', name: 'Physics', icon: '⚡', questions: 320, time: '35 Mins', color: 'rgba(255, 251, 235, 1)', borderColor: 'rgba(253, 230, 138, 1)',
        svg: '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>' },
      { id: 'chem', name: 'Chemistry', icon: '🧪', questions: 340, time: '35 Mins', color: 'rgba(245, 243, 255, 1)', borderColor: 'rgba(221, 214, 254, 1)',
        svg: '<circle cx="12" cy="12" r="3"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(45 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-45 12 12)"/>' },
      { id: 'bio', name: 'Biology', icon: '🧬', questions: 410, time: '30 Mins', color: 'rgba(240, 253, 244, 1)', borderColor: 'rgba(187, 247, 208, 1)',
        svg: '<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2v12.2a9 9 0 0 1-8 8.8z"/>' },
      { id: 'econ', name: 'Economics', icon: '📈', questions: 280, time: '30 Mins', color: 'rgba(240, 253, 250, 1)', borderColor: 'rgba(153, 246, 228, 1)',
        svg: '<path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>' }
    ];

    // Premium university → setup_premium.html mapping
    const PREMIUM_SETUP_MAP = {
      'UNIBEN': '../core/setup_premium.html?exam_id=nigeria%2Funiben_post_utme&data_source=ng%2Fexams%2Funiversity_entrance%2Fpost_utme%2Funiben%2Findex.json&logo=%2Fassets%2Fcountry%2Fnigeria%2Funiversity_of_benin.webp',
      'SDU':    '../core/setup_premium.html?exam_id=nigeria%2Fsouthern_delta_university&data_source=ng%2Fexams%2Funiversity%2Fsouthern_delta_university_sdu%2Findex.json',
    };
    const setupTarget = PREMIUM_SETUP_MAP[uniName.toUpperCase()] || '../core/setup.html';

    function renderSubjects() {
      const grid = document.getElementById('subjectGrid');
      grid.innerHTML = '';

      subjects.forEach(sub => {
        const card = document.createElement('div');
        card.className = 'subject-card';
        card.innerHTML = `
          <div class="subject-watermark">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
              ${sub.svg}
            </svg>
          </div>
          <div class="access-tag">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"></path></svg>
            Unlocked
          </div>
          <div class="subject-icon" style="background: ${sub.color}; border-color: ${sub.borderColor};">
            ${sub.icon}
          </div>
          <h3 class="subject-name" title="${sub.name}">${sub.name}</h3>
          <div class="subject-meta">
            <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg> ${sub.questions} Qs</span>
            <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> ${sub.time}</span>
          </div>
          <div class="card-footer">
            <button class="btn-primary" onclick="window.location.href='${setupTarget}'" style="width:100%; justify-content:center;">Start Exam</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openRequestModal() {
      document.getElementById('requestModal').classList.add('show');
    }

    function closeRequestModal() {
      document.getElementById('requestModal').classList.remove('show');
    }

    function submitRequest() {
      alert('Your request has been submitted successfully! We will notify you when the subject is added.');
      closeRequestModal();
    }

    // Initialize
    renderSubjects();
  </script>
</body>
</html>
