<!DOCTYPE html>
<html lang="en">
<head>
<script>
  /* Anti-flash: apply saved theme before first paint */
  (function() {
    try {
      var t = localStorage.getItem('mec_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch(e) {}
  })();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – My Exam Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    body {
      background: var(--bg-base);
      background-image: 
        radial-gradient(at 0% 0%, rgba(183, 12, 1, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(183, 12, 1, 0.15) 0px, transparent 50%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }
    .modal-box {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      position: relative;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0,0,0,0.05);
      animation: popIn 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
    }
    @keyframes popIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .btn-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #f5f5f5;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn-close:hover {
      background: #e5e7eb;
      color: var(--text-primary);
    }
    .modal-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .modal-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .modal-subtitle {
      font-size: 14px;
      color: var(--text-muted);
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-input:focus {
      border-color: #2563eb;
    }
    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-top: 8px;
    }
    .btn-primary:hover {
      background: #960a01;
      transform: translateY(-1px);
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #ebebeb;
    }
    .divider::before { margin-right: .5em; }
    .divider::after { margin-left: .5em; }
    .btn-google {
      width: 100%;
      padding: 12px;
      background: var(--bg-card);
      color: #374151;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.15s;
    }
    .btn-google:hover {
      background: var(--bg-base);
    }
    .auth-links {
      text-align: center;
      margin-top: 24px;
      font-size: 13.5px;
      color: var(--text-muted);
    }
    .auth-links a {
      color: #2563eb;
      font-weight: 600;
      text-decoration: none;
    }
    .auth-links a:hover {
      text-decoration: underline;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../../components/supabase.js"></script>
  <link rel="stylesheet" href="../../components/dark-mode.css">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CHG6831RHH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-CHG6831RHH');
  </script>
</head>
<body>
  <div class="modal-overlay">
    <div class="modal-box">
      <a id="btn-close" href="/" onclick="if(window.MEC_NAV){event.preventDefault();window.MEC_NAV.go('home')}" class="btn-close" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </a>
      
      <div class="modal-header">
        <h2 class="modal-title">Welcome Back</h2>
        <p class="modal-subtitle">Login to access your personalized learning hub.</p>
      </div>

      <div id="loginSection">
        <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" id="email-input" class="form-input" placeholder="Enter your email" required>
          </div>
          <div class="form-group" style="margin-bottom: 24px;">
            <label class="form-label">Password</label>
            <input type="password" id="password-input" class="form-input" placeholder="Enter your password" required>
            <div style="text-align: right; margin-top: 8px;">
              <a href="#" onclick="openForgotPassword(); return false;" style="color: #2563eb; font-size: 13px; font-weight: 600; text-decoration: none;">Forgot password?</a>
            </div>
          </div>
          
          <button type="submit" id="submit-btn" class="btn-primary">Sign In</button>
        </form>

        <div class="divider">or</div>

        <button type="button" class="btn-google" onclick="handleGoogleLogin()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>

        <div class="auth-links">
          Don't have an account? <a href="sign_up.html">Sign Up</a>
        </div>
      </div>

      <!-- FORGOT PASSWORD FORM -->
      <form id="forgotPasswordForm" style="display: none;" onsubmit="event.preventDefault(); handleSendOTP();">
        <div class="form-group">
          <label class="form-label">Enter your email</label>
          <input type="email" id="forgot-email" class="form-input" placeholder="e.g. name@example.com" required>
        </div>
        <button type="submit" id="btn-send-otp" class="btn-primary">Send Reset Code</button>
        <div class="auth-links">
          Remembered? <a href="#" onclick="showLoginForm(); return false;">Back to Login</a>
        </div>
      </form>

      <!-- RESET PASSWORD FORM -->
      <form id="resetPasswordForm" style="display: none;" onsubmit="event.preventDefault(); handleResetPassword();">
        <div class="form-group">
          <label class="form-label">6-Digit Code</label>
          <input type="text" id="forgot-otp" class="form-input" placeholder="123456" required autocomplete="one-time-code">
        </div>
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input type="password" id="forgot-new-password" class="form-input" placeholder="Enter new password" required minlength="8" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <input type="password" id="forgot-confirm-password" class="form-input" placeholder="Confirm new password" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" id="btn-reset-pwd" class="btn-primary">Reset Password</button>
        <div class="auth-links">
          <a href="#" onclick="showLoginForm(); return false;">Cancel</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Resolve post-auth destination: honour ?redirect= or fall back to index
    function getRedirectUrl() {
      const p = new URLSearchParams(window.location.search);
      const r = p.get('redirect');
      if (r) {
        try {
          // Safety: only allow same-origin redirects. Pass origin as base so relative paths like /wallet-dashboard work.
          const parsed = new URL(decodeURIComponent(r), window.location.origin);
          if (parsed.origin === window.location.origin) return parsed.href;
        } catch(e) {
          // If URL parsing fails, fall through to default
        }
      }
      const cc = localStorage.getItem('mec_country') || 'ng';
      return new URL('/' + cc, window.location.href).href;
    }

    // Wire up the close/cancel button to the redirect destination
    document.getElementById('btn-close').href = getRedirectUrl();

    // Lazy getter: resolves Supabase at call-time, not parse-time.
    // This is obfuscator-safe and avoids TDZ (Temporal Dead Zone) errors.
    function getClient() { return window.MECSupabase.getSupabase(); }

    async function handleLogin() {
      const email = document.getElementById('email-input').value;
      const password = document.getElementById('password-input').value;
      const btn = document.getElementById('submit-btn');
      
      try {
        btn.disabled = true;
        btn.innerText = 'Signing In...';

        const { error } = await getClient().auth.signInWithPassword({ email, password });
        
        if (error) throw error;
        
        // Wait to ensure Supabase persists the session to localStorage before redirecting
        setTimeout(() => {
          window.location.href = getRedirectUrl();
        }, 1200);
      } catch (error) {
        showToast('Error: ' + error.message, 'error');
        console.error(error);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Sign In';
      }
    }

    async function handleGoogleLogin() {
      try {
        const { error } = await getClient().auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: getRedirectUrl()
          }
        });
        if (error) throw error;
      } catch (error) {
        showToast('Error with Google Login: ' + error.message, 'error');
        console.error(error);
      }
    }

    // -- Forgot Password UI Toggles --
    function openForgotPassword() {
      document.querySelector('.modal-title').innerText = 'Reset Password';
      document.querySelector('.modal-subtitle').innerText = "Enter your email to receive a recovery code.";
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('forgotPasswordForm').style.display = 'block';
      document.getElementById('resetPasswordForm').style.display = 'none';
    }

    function showLoginForm() {
      document.querySelector('.modal-title').innerText = 'Welcome Back';
      document.querySelector('.modal-subtitle').innerText = "Login to access your personalized learning hub.";
      document.getElementById('loginSection').style.display = 'block';
      document.getElementById('forgotPasswordForm').style.display = 'none';
      document.getElementById('resetPasswordForm').style.display = 'none';
    }

    // -- Forgot Password Logic --
    async function handleSendOTP() {
      const email = document.getElementById('forgot-email').value;
      const btn = document.getElementById('btn-send-otp');
      try {
        btn.disabled = true;
        btn.innerText = 'Sending...';

        const { error } = await getClient().auth.resetPasswordForEmail(email);
        if (error) throw error;
        
        showToast("Success! Check your email for the 6-digit code.", 'success');
        
        document.querySelector('.modal-subtitle').innerText = "Enter the 6-digit code and your new password.";
        document.getElementById('forgotPasswordForm').style.display = 'none';
        document.getElementById('resetPasswordForm').style.display = 'block';

      } catch(err) {
        showToast('Error: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Send Reset Code';
      }
    }

    async function handleResetPassword() {
      const email = document.getElementById('forgot-email').value;
      const token = document.getElementById('forgot-otp').value;
      const newPassword = document.getElementById('forgot-new-password').value;
      const confirmPassword = document.getElementById('forgot-confirm-password').value;
      const btn = document.getElementById('btn-reset-pwd');

      if (newPassword !== confirmPassword) {
        showToast('Error: Passwords do not match', 'error');
        return;
      }

      try {
        btn.disabled = true;
        btn.innerText = 'Verifying & Resetting...';

        // Verify OTP to temporarily log them in
        const { error: verifyError } = await getClient().auth.verifyOtp({
          email,
          token,
          type: 'recovery'
        });
        
        if (verifyError) {
          document.getElementById('forgot-otp').value = ''; // Clear OTP field
          throw verifyError;
        }

        // Immediately update password
        const { error: updateError } = await getClient().auth.updateUser({
          password: newPassword
        });

        if (updateError) throw updateError;

        showToast("Password reset successfully! You are now logged in.", 'success');
        setTimeout(() => {
          window.location.href = getRedirectUrl();
        }, 1500);

      } catch(err) {
        showToast('Error: ' + err.message, 'error');
        btn.disabled = false;
        btn.innerText = 'Reset Password';
      }
    }
  </script>

  <script src="../../components/toast.js"></script>
</body>
</html>
