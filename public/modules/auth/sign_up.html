<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up – My Exam Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    body {
      background: #f9fafb;
      background-image: 
        radial-gradient(at 0% 0%, rgba(183, 12, 1, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(183, 12, 1, 0.15) 0px, transparent 50%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }
    .modal-box {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      position: relative;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0,0,0,0.05);
      animation: popIn 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
    }
    @keyframes popIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .btn-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #f5f5f5;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7280;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn-close:hover {
      background: #e5e7eb;
      color: #131212;
    }
    .modal-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .modal-title {
      font-size: 24px;
      font-weight: 800;
      color: #131212;
      margin-bottom: 8px;
    }
    .modal-subtitle {
      font-size: 14px;
      color: #6b7280;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-input:focus {
      border-color: #b70c01;
    }
    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #b70c01;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-top: 8px;
    }
    .btn-primary:hover {
      background: #960a01;
      transform: translateY(-1px);
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: #9ca3af;
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #ebebeb;
    }
    .divider::before { margin-right: .5em; }
    .divider::after { margin-left: .5em; }
    .btn-google {
      width: 100%;
      padding: 12px;
      background: #fff;
      color: #374151;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.15s;
    }
    .btn-google:hover {
      background: #f9fafb;
    }
    .auth-links {
      text-align: center;
      margin-top: 24px;
      font-size: 13.5px;
      color: #6b7280;
    }
    .auth-links a {
      color: #b70c01;
      font-weight: 600;
      text-decoration: none;
    }
    .auth-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="modal-overlay">
    <div class="modal-box">
      <a href="../index.html" class="btn-close" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </a>
      
      <div class="modal-header">
        <h2 class="modal-title">Create Account</h2>
        <p class="modal-subtitle">Join the best exam companion platform.</p>
      </div>

      <form id="signupForm" onsubmit="event.preventDefault(); handleSignUp();">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-input" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" placeholder="Create a password" required>
        </div>
        
        <button type="submit" class="btn-primary">Sign Up</button>
      </form>

      <div class="divider">or</div>

      <button type="button" class="btn-google" onclick="handleGoogleSignUp()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign up with Google
      </button>

      <div class="auth-links">
        Already have an account? <a href="login.html">Log In</a>
      </div>
    </div>
  </div>

  <script>
    function handleSignUp() {
      // Directs to OTP verification after email signup
      window.location.href = 'otp.html';
    }

    function handleGoogleSignUp() {
      // Directs to fill form after successful Google signup
      window.location.href = 'fill_form.html';
    }
  </script>
</body>
</html>
