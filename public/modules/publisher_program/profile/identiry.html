<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publisher Hub - Identity Verification</title>
    <!-- Premium Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-dark: #1d1d1f;
            --text-gray: #757575;
            --primary-blue: #3b82f6; 
            --border-color: #d1d5db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Bar */
        .top-bar {
            padding: 20px 24px;
            display: flex;
            align-items: center;
        }

        /* Progress Bar */
        .progress-container {
            padding: 0 24px;
            margin-bottom: 24px;
        }

        .progress-track {
            width: 100%;
            height: 4px;
            background-color: #e5e7eb;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            width: 66.66%; /* Step 2 of 3 */
            height: 100%;
            background-color: var(--primary-blue);
        }

        /* Header Texts */
        .header-content {
            padding: 0 24px;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
            color: #111;
        }

        p.subtitle {
            font-size: 15px;
            color: var(--text-gray);
            font-weight: 400;
        }

        /* Form Area */
        .form-container {
            padding: 0 24px;
            flex: 1;
        }

        .input-group {
            position: relative;
            margin-bottom: 24px;
            margin-top: 8px;
        }

        .input-group label {
            position: absolute;
            top: -10px;
            left: 12px;
            background-color: white;
            padding: 0 6px;
            font-size: 13px;
            color: #9ca3af;
            font-weight: 400;
            z-index: 10;
        }

        /* Normal label for phone number group */
        .group-label {
            font-size: 13px;
            color: #9ca3af;
            font-weight: 400;
            margin-bottom: 8px;
            display: block;
        }

        .input-control {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px 14px;
            font-size: 16px;
            color: #111;
            outline: none;
            transition: border-color 0.2s ease;
            background-color: transparent;
            appearance: none;
        }

        .input-control:focus {
            border-color: var(--primary-blue);
        }
        
        .input-control::placeholder {
            color: #111; /* Make placeholder darker to match screenshot style */
            opacity: 1;
        }

        /* Select arrow */
        .select-arrow {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #9ca3af;
        }

        /* Phone layout */
        .phone-layout {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .phone-prefix {
            width: 30%;
            position: relative;
        }
        
        .phone-number {
            width: 70%;
        }

        /* Footer Controls */
        .footer-controls {
            padding: 24px;
            margin-top: auto;
            display: flex;
            gap: 12px;
        }

        .btn-back {
            flex: 1;
            background-color: white;
            color: #9ca3af;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .btn-back:hover {
            background-color: #f9fafb;
            color: #6b7280;
        }

        .btn-next {
            flex: 1;
            background-color: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-next:hover {
            background-color: #2563eb;
        }
        
        .btn-next:active {
            transform: scale(0.99);
        }

    </style>
</head>
<body>

    <!-- Top Bar is blank in this screenshot except for the progress bar -->
    <div class="top-bar" style="padding-bottom: 0;"></div>

    <!-- Progress Bar -->
    <div class="progress-container">
        <div class="progress-track">
            <div class="progress-fill"></div>
        </div>
    </div>

    <!-- Headers -->
    <div class="header-content">
        <h1>Tell us more about yourself</h1>
        <p class="subtitle">We need to verify your identity before you join</p>
    </div>

    <!-- Form Area -->
    <div class="form-container">
        
        <!-- Legal first name -->
        <div class="input-group">
            <label>Legal first name</label>
            <input type="text" class="input-control" placeholder="Enter your first name">
        </div>

        <!-- Legal last name -->
        <div class="input-group">
            <label>Legal last name</label>
            <input type="text" class="input-control" placeholder="Enter your last name">
        </div>

        <!-- Country (No floating label in screenshot) -->
        <div class="input-group" style="margin-top: 0;">
            <select class="input-control" style="color: #111;">
                <option value="" disabled>Select Country</option>
                <option value="NG" selected>Nigeria</option>
                <option value="GH">Ghana</option>
                <option value="KE">Kenya</option>
                <option value="ZA">South Africa</option>
            </select>
            <div class="select-arrow">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>
        </div>

        <!-- Email -->
        <div class="input-group">
            <label>Your Email</label>
            <input type="email" class="input-control" placeholder="Enter your email address">
        </div>

        <!-- Phone Number Section -->
        <div>
            <label class="group-label">Phone Number</label>
            <div class="phone-layout">
                <div class="phone-prefix">
                    <select class="input-control">
                        <option value="+234" selected>+234</option>
                        <option value="+233">+233</option>
                        <option value="+254">+254</option>
                    </select>
                    <div class="select-arrow">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>
                </div>
                <div class="phone-number">
                    <input type="tel" class="input-control" placeholder="Enter phone number">
                </div>
            </div>
        </div>

    </div>

    <!-- Footer Controls -->
    <div class="footer-controls">
        <button class="btn-back" onclick="window.location.href='bio.html'">Back</button>
        <button class="btn-next" onclick="window.location.href='account.html'">Next</button>
    </div>

</body>
</html>
