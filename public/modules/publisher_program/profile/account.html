<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publisher Hub - Link Account</title>
    <!-- Premium Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-dark: #1d1d1f;
            --text-gray: #9ca3af;
            --primary-blue: #3b82f6; 
            --border-color: #d1d5db;
            --opay-green: #1cc698; /* Exact match to the image */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Bar */
        .top-bar {
            padding: 20px 24px;
            display: flex;
            align-items: center;
            padding-bottom: 0;
        }
        
        .back-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: #666;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Progress Bar */
        .progress-container {
            padding: 24px;
            padding-top: 16px;
        }

        .progress-track {
            width: 100%;
            height: 4px;
            background-color: #e5e7eb;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            width: 100%; /* Step 3 of 3 */
            height: 100%;
            background-color: var(--primary-blue);
        }

        /* Header Texts */
        .header-content {
            padding: 0 24px;
            margin-bottom: 28px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            color: #111;
        }

        p.subtitle {
            font-size: 15px;
            color: var(--text-gray);
            font-weight: 500;
        }

        /* Form Area */
        .form-container {
            padding: 0 24px;
            flex: 1;
        }

        .input-group {
            position: relative;
            margin-bottom: 4px; /* Reduced to fit hint below */
            margin-top: 16px;
        }

        .input-group label {
            position: absolute;
            top: -10px;
            left: 12px;
            background-color: white;
            padding: 0 6px;
            font-size: 14px;
            color: #9ca3af;
            font-weight: 400;
            z-index: 10;
        }

        .input-control {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px 14px;
            font-size: 16px;
            color: #111;
            outline: none;
            transition: border-color 0.2s ease;
            background-color: transparent;
        }
        
        .input-control::placeholder {
            color: #9ca3af; /* Grey hint text as requested */
            font-weight: 400;
        }

        /* Active focus state styles matching the image */
        .input-control:focus {
            border-color: var(--primary-blue);
            border-width: 1px;
        }
        .input-group:focus-within label {
            color: var(--primary-blue);
        }

        .hint-text {
            font-size: 13px;
            color: #b0b4bd;
            margin-bottom: 24px;
            padding: 0 4px;
            display: block;
        }

        /* Register Opay Button */
        .register-opay-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            border: 1px solid var(--opay-green);
            background-color: white;
            border-radius: 6px;
            padding: 14px;
            margin-bottom: 24px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .register-opay-btn:hover {
            background-color: #f0fdf9;
        }
        
        .register-opay-btn:active {
            transform: scale(0.99);
        }

        .register-opay-btn span {
            color: var(--opay-green);
            font-size: 16px;
            font-weight: 500;
            margin-left: 8px;
        }

        /* SVG for Opay Logo */
        .opay-logo-svg {
            width: 24px;
            height: 24px;
        }

        /* Cursor / Caret simulation from the image */
        .input-group.active-simulated .input-control {
            border-color: var(--primary-blue);
        }
        .input-group.active-simulated label {
            color: var(--primary-blue);
        }

        /* Footer Controls */
        .footer-controls {
            padding: 24px;
            margin-top: auto;
            display: flex;
            gap: 12px;
        }

        .btn-back {
            flex: 1;
            background-color: #fafafa;
            color: #9ca3af;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .btn-back:hover {
            background-color: #f3f4f6;
            color: #6b7280;
        }

        .btn-confirm {
            flex: 1;
            background-color: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-confirm:hover {
            background-color: #2563eb;
        }
        
        .btn-confirm:active {
            transform: scale(0.99);
        }

    </style>
</head>
<body>

    <!-- Top Bar with Back Arrow -->
    <div class="top-bar">
        <button class="back-btn" onclick="window.location.href='identiry.html'">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </button>
    </div>

    <!-- Progress Bar -->
    <div class="progress-container">
        <div class="progress-track">
            <div class="progress-fill"></div>
        </div>
    </div>

    <!-- Headers -->
    <div class="header-content">
        <h1>Link an Opay account</h1>
        <p class="subtitle">Make sure you always get paid on time</p>
    </div>

    <!-- Form Area -->
    <div class="form-container">
        
        <!-- Opay Account -->
        <div class="input-group">
            <label>Opay Account (optional)</label>
            <!-- Hardcoded text removed, replaced with grey placeholder hint -->
            <input type="text" class="input-control" placeholder="Enter Opay account number">
        </div>
        <span class="hint-text">Please make sure you add a valid Opay account to get paid.</span>

        <!-- Register Opay Button -->
        <button class="register-opay-btn" onclick="window.open('https://www.opayweb.com/', '_blank')">
            <img src="../../../assets/publisher_program/opay.webp" alt="Opay Logo" style="height: 44px; width: auto; max-width: 100%; object-fit: contain;">
        </button>

        <!-- Referral Code -->
        <div class="input-group active-simulated">
            <label>Referral code (optional)</label>
            <!-- Hardcoded text removed, replaced with grey placeholder hint -->
            <input type="text" class="input-control" placeholder="Enter referral code">
        </div>
        <span class="hint-text">We will reward your inviter once you successfully publish an article.</span>

    </div>

    <!-- Footer Controls -->
    <div class="footer-controls">
        <button class="btn-back" onclick="window.location.href='identiry.html'">Back</button>
        <button class="btn-confirm" onclick="window.location.href='../dashboard/dashboard.html'">Confirm</button>
    </div>

</body>
</html>
