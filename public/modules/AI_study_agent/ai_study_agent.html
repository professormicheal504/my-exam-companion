<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Agent — My Exam Companion</title>
    <meta name="description" content="Your AI-powered study tutor for JAMB, WAEC, and NECO prep.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script defer src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="/components/topbar.css">
  <link rel="stylesheet" href="/components/sidebar.css?v=4">
    <style>
        /* ══════════════════════════════════════════
           DESIGN TOKENS
        ══════════════════════════════════════════ */
        :root {
            --bg:          #f0eeea;
            --bg-card:     #ffffff;
            --text-primary:#1a1a1a;
            --text-muted:  #888880;
            --accent:      #b70c01;
            --border:      rgba(0,0,0,0.10);
            --input-bg:    #ffffff;
            --chip-bg:     #ffffff;
            --chip-border: rgba(0,0,0,0.10);
            --shadow-sm:   0 1px 4px rgba(0,0,0,0.07);
            --shadow-md:   0 4px 20px rgba(0,0,0,0.08);
            --radius-xl:   20px;
            --radius-lg:   14px;
            --radius-full: 999px;
        }

        /* ══════════════════════════════════════════
           RESET & BASE
        ══════════════════════════════════════════ */
        *, *::before, *::after {
            margin: 0; padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            display: flex;
            min-height: 100vh;
            height: 100vh;
            overflow: hidden;
        }

        /* ══════════════════════════════════════════
           LAYOUT — sidebar offset
        ══════════════════════════════════════════ */
        .app-container {
            margin-left: 90px;
            flex: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
        }

        /* ══════════════════════════════════════════
           TOP BAR
        ══════════════════════════════════════════ */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 28px;
            flex-shrink: 0;
            background: var(--bg);
        }

        .topbar__logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .topbar__brand {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.2px;
        }

        .topbar__plan {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--chip-bg);
            border: 1px solid var(--chip-border);
            border-radius: var(--radius-full);
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: box-shadow 0.15s;
        }

        .topbar__plan:hover { box-shadow: var(--shadow-sm); }

        .topbar__plan-sep {
            width: 1px;
            height: 14px;
            background: var(--chip-border);
        }

        .topbar__plan-upgrade {
            color: var(--text-primary);
            font-weight: 600;
        }

        .topbar__icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 20px;
            transition: background 0.15s;
        }

        .topbar__icon-btn:hover { background: rgba(0,0,0,0.06); }

        /* ══════════════════════════════════════════
           MAIN — scrollable content area
        ══════════════════════════════════════════ */
        .main {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: none;
            display: flex;
            flex-direction: column;
        }
        .main::-webkit-scrollbar { display: none; }

        /* ══════════════════════════════════════════
           HERO SECTION
        ══════════════════════════════════════════ */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px 32px;
            text-align: center;
        }

        .hero__icon {
            font-size: 52px;
            line-height: 1;
            margin-bottom: 20px;
            animation: spin-star 12s linear infinite;
            display: inline-block;
            color: var(--accent);
        }

        @keyframes spin-star {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Star SVG icon */
        .hero__star {
            width: 56px;
            height: 56px;
            margin-bottom: 20px;
            animation: spin-star 14s linear infinite;
            flex-shrink: 0;
        }

        .hero__title {
            font-family: 'Instrument Serif', Georgia, serif;
            font-size: clamp(32px, 6vw, 52px);
            font-weight: 400;
            color: var(--text-primary);
            line-height: 1.12;
            letter-spacing: -0.5px;
            max-width: 520px;
        }

        .hero__title em {
            font-style: italic;
            color: #4a4a44;
        }

        /* ══════════════════════════════════════════
           INPUT AREA
        ══════════════════════════════════════════ */
        .input-section {
            padding: 0 24px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .input-card {
            width: 100%;
            max-width: 680px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .input-textarea {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 400;
            color: var(--text-primary);
            resize: none;
            padding: 20px 22px 8px;
            min-height: 64px;
            max-height: 200px;
            line-height: 1.5;
        }

        .input-textarea::placeholder {
            color: #aaa;
            font-weight: 400;
        }

        .input-toolbar {
            display: flex;
            align-items: center;
            padding: 10px 14px 14px;
            gap: 6px;
        }

        .toolbar-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: none;
            border-radius: var(--radius-full);
            padding: 8px 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
        }

        .toolbar-btn:hover {
            background: rgba(0,0,0,0.05);
            color: var(--text-primary);
        }

        .toolbar-btn i { font-size: 18px; }

        .toolbar-sep {
            width: 1px;
            height: 20px;
            background: var(--border);
            flex-shrink: 0;
        }

        .toolbar-spacer { flex: 1; }

        .toolbar-icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 20px;
            transition: background 0.15s, color 0.15s;
            flex-shrink: 0;
        }

        .toolbar-icon-btn:hover {
            background: rgba(0,0,0,0.05);
            color: var(--text-primary);
        }

        .submit-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--text-primary);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            font-size: 17px;
            transition: background 0.2s, transform 0.2s;
            flex-shrink: 0;
        }

        .submit-btn:hover {
            background: #333;
            transform: scale(1.05);
        }

        /* ══════════════════════════════════════════
           QUICK-ACTION CHIPS
        ══════════════════════════════════════════ */
        .chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 680px;
        }

        .chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--chip-bg);
            border: 1px solid var(--chip-border);
            border-radius: var(--radius-full);
            padding: 9px 18px;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: box-shadow 0.15s, background 0.15s;
            box-shadow: var(--shadow-sm);
        }

        .chip:hover {
            box-shadow: var(--shadow-md);
            background: #f8f8f5;
        }

        .chip i { font-size: 16px; color: var(--text-muted); }

        /* ══════════════════════════════════════════
           RESPONSIVE — Tablet ≤ 768px
        ══════════════════════════════════════════ */
        @media (max-width: 768px) {
            .app-container { margin-left: 80px; }
        }

        /* ══════════════════════════════════════════
           RESPONSIVE — Mobile ≤ 600px
        ══════════════════════════════════════════ */
        @media (max-width: 600px) {
            .app-container { margin-left: 0; }

            .topbar { padding: 12px 16px; }

            .topbar__plan-sep,
            .topbar__plan-upgrade { display: none; }

            .hero {
                padding: 32px 20px 20px;
            }

            .hero__star {
                width: 44px;
                height: 44px;
                margin-bottom: 16px;
            }

            .hero__title {
                font-size: clamp(28px, 8vw, 38px);
            }

            .input-section {
                padding: 0 14px 20px;
                gap: 12px;
            }

            /* Hide model selector text on very small screens */
            .toolbar-btn .toolbar-model-name { display: none; }

            .chips { gap: 8px; }

            .chip {
                font-size: 13px;
                padding: 8px 14px;
            }
        }

        /* ══════════════════════════════════════════
           RESPONSIVE — Very small ≤ 360px
        ══════════════════════════════════════════ */
        @media (max-width: 360px) {
            .hero__title { font-size: 26px; }
            .toolbar-sep { display: none; }
        }
    </style>
</head>
<body>
    <app-sidebar data-base="/"></app-sidebar>

    <div class="app-container">

        <!-- Top Bar -->
        <app-topbar data-base="/"></app-topbar>

        <!-- Scrollable body -->
        <main class="main">
            <!-- Hero greeting -->
            <section class="hero">
                <!-- Animated asterisk star -->
                <svg class="hero__star" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M28 4 L30.5 24.5 L50 22 L32 30 L50 38 L30.5 35.5 L28 56 L25.5 35.5 L6 38 L24 30 L6 22 L25.5 24.5 Z"
                          fill="#c0392b" opacity="0.92"/>
                </svg>

                <h1 class="hero__title">
                    Ready to ace<br>
                    <em>your exams today?</em>
                </h1>
            </section>

            <!-- Input + chips -->
            <section class="input-section">

                <!-- Chat input card -->
                <div class="input-card">
                    <textarea
                        id="chat-input"
                        class="input-textarea"
                        placeholder="How can I help you today?"
                        rows="1"
                        aria-label="Chat with AI tutor"
                    ></textarea>

                    <div class="input-toolbar">
                        <!-- Attach -->
                        <button class="toolbar-btn" aria-label="Attach file">
                            <i class="ph ph-plus"></i>
                        </button>

                        <span class="toolbar-sep"></span>

                        <!-- Model selector -->
                        <button class="toolbar-btn" aria-label="Select AI model" id="model-selector-btn">
                            <span class="toolbar-model-name">Gemini Pro</span>
                            <i class="ph ph-caret-down"></i>
                        </button>

                        <div class="toolbar-spacer"></div>

                        <!-- Mic / Voice -->
                        <button class="toolbar-icon-btn" id="mic-btn" aria-label="Voice input">
                            <i class="ph ph-microphone"></i>
                        </button>

                        <!-- Sound wave indicator -->
                        <button class="toolbar-icon-btn" aria-label="Audio">
                            <i class="ph ph-waveform"></i>
                        </button>
                    </div>
                </div>

                <!-- Quick-action chips -->
                <div class="chips" role="list">
                    <button class="chip" role="listitem" onclick="setPrompt('Explain a concept I\'m struggling with')">
                        <i class="ph ph-code"></i> Explain Concept
                    </button>
                    <button class="chip" role="listitem" onclick="setPrompt('Give me JAMB past questions on ')">
                        <i class="ph ph-pencil-simple"></i> Past Questions
                    </button>
                    <button class="chip" role="listitem" onclick="setPrompt('Quiz me on ')">
                        <i class="ph ph-graduation-cap"></i> Quiz Me
                    </button>
                    <button class="chip" role="listitem" onclick="setPrompt('Summarise this topic for me: ')">
                        <i class="ph ph-coffee"></i> Summarise Topic
                    </button>
                    <button class="chip" role="listitem" onclick="setPrompt('What are the most likely exam topics for ')">
                        <i class="ph ph-lightbulb"></i> Exam Tips
                    </button>
                </div>

            </section>
        </main>

    </div><!-- /.app-container -->

    <script defer src="/components/topbar.js"></script>
  <script defer src="/components/nav.js"></script>
<script defer src="/components/sidebar.js?v=6"></script>
    <script>
        /* ── Auto-grow textarea ── */
        const textarea = document.getElementById('chat-input');
        textarea.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        /* ── Quick-chip helper ── */
        function setPrompt(text) {
            textarea.value = text;
            textarea.focus();
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
            // position cursor at end
            textarea.selectionStart = textarea.selectionEnd = text.length;
        }

        /* ── Auto-load prompt from other modules ── */
        const initialPrompt = localStorage.getItem('ai_initial_prompt');
        if (initialPrompt) {
            setPrompt(initialPrompt);
            localStorage.removeItem('ai_initial_prompt');
        }

        /* ── Mic button toggle ── */
        const micBtn = document.getElementById('mic-btn');
        micBtn.addEventListener('click', function () {
            this.classList.toggle('active');
            const icon = this.querySelector('i');
            if (this.classList.contains('active')) {
                icon.className = 'ph-fill ph-microphone';
                this.style.color = '#b70c01';
            } else {
                icon.className = 'ph ph-microphone';
                this.style.color = '';
            }
        });

        /* ── Dynamic greeting by time ── */
        (function () {
            const h = new Date().getHours();
            let phrase = 'Ready to ace';
            if (h >= 5  && h < 12) phrase = 'Good morning! Let\'s study';
            if (h >= 12 && h < 17) phrase = 'Good afternoon. Time to study';
            if (h >= 17 && h < 21) phrase = 'Clocking in for the evening shift.';
            if (h >= 21 || h < 5)  phrase = 'Burning the midnight oil?';

            const title = document.querySelector('.hero__title');
            if (title) {
                // Replace only the first text node / plain line
                title.innerHTML = phrase + '<br><em>your exams today.</em>';
            }
        })();
    </script>
</body>
</html>
