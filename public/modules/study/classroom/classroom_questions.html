    window.lockAnswer = function (explUrl, tag, el) {
      if (!tag) return;
      showCustomConfirm(`Do you want to lock in option ${tag.toUpperCase()} as your final answer?`, () => {
        const card = el ? el.closest('.card') : null;
        const qId = card ? card.dataset.qid : '';
        const topic = card ? card.dataset.topic : '';

        // Determine correct answer from data-correct attribute on the clicked option
        const isCorrect = el ? el.dataset.correct === 'true' : false;

        // Find the correct option element in this card
        const allOpts = card ? card.querySelectorAll('.q-option') : [];
        const correctOpt = Array.from(allOpts).find(o => o.dataset.correct === 'true');

        // Mastery Tracking
        try {
          if (topic && qId) {
            const key = `mastery_completed_${EXAM_ID}_${topic}`;
            let completed = [];
            try { completed = JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { }
            if (!completed.includes(qId)) {
              completed.push(qId);
              localStorage.setItem(key, JSON.stringify(completed));
            }
          }
        } catch (e) { }

        // Record to Task Engine
        _mecClassroomSession.total += 1;
        if (isCorrect) _mecClassroomSession.correct += 1;
        if (typeof MECTasks !== 'undefined') {
          MECTasks.recordClassroomAnswer(isCorrect, _mecClassroomSession.total);
        }

        // --- ANSWER REVEAL ---
        // Style all options: highlight correct green, selected wrong red
        allOpts.forEach(opt => {
          opt.style.pointerEvents = 'none'; // disable further clicks
          opt.style.cursor = 'default';
          if (opt.dataset.correct === 'true') {
            opt.style.background = '#dcfce7';
            opt.style.borderColor = '#16a34a';
            opt.style.color = '#15803d';
            const letter = opt.querySelector('.q-opt-letter');
            if (letter) { letter.style.background = '#16a34a'; letter.style.color = '#fff'; }
            if (opt !== el) {
              // append correct badge
              const badge = document.createElement('span');
              badge.textContent = '✓ Correct Answer';
              badge.style.cssText = 'margin-left:auto;font-size:11px;font-weight:700;color:#16a34a;white-space:nowrap;';
              opt.appendChild(badge);
            }
          } else if (opt === el && !isCorrect) {
            opt.style.background = '#fee2e2';
            opt.style.borderColor = '#dc2626';
            opt.style.color = '#b91c1c';
            const letter = opt.querySelector('.q-opt-letter');
            if (letter) { letter.style.background = '#dc2626'; letter.style.color = '#fff'; }
            const badge = document.createElement('span');
            badge.textContent = '✗ Wrong';
            badge.style.cssText = 'margin-left:auto;font-size:11px;font-weight:700;color:#dc2626;white-space:nowrap;';
            opt.appendChild(badge);
          }
        });

        // Show a brief result banner inside the card
        const banner = document.createElement('div');
        banner.style.cssText = `
          margin-top:14px;
          padding:12px 16px;
          border-radius:10px;
          font-size:13px;
          font-weight:700;
          display:flex;
          align-items:center;
          gap:8px;
          background:${isCorrect ? '#dcfce7' : '#fee2e2'};
          color:${isCorrect ? '#15803d' : '#b91c1c'};
          border:1px solid ${isCorrect ? '#86efac' : '#fca5a5'};
          animation:fadeIn 0.2s ease;
        `;
        const correctLetterEl = correctOpt ? correctOpt.querySelector('.q-opt-letter') : null;
        const correctLetter = correctLetterEl ? correctLetterEl.textContent.trim() : '?';
        banner.innerHTML = isCorrect
          ? `<span style="font-size:18px;">🎉</span> Correct! Navigating to discussion…`
          : `<span style="font-size:18px;">❌</span> Wrong! The correct answer is <strong style="margin-left:4px;">${correctLetter}</strong>. Navigating to discussion…`;
        const optionsWrapper = card ? card.querySelector('.q-options') : null;
        if (optionsWrapper) optionsWrapper.after(banner);

        // Navigate after a short delay so user sees the reveal
        setTimeout(() => {
          window.location.href = `${explUrl}#comments`;
        }, 1800);
      });
    };

    window.fetchInteractions = async function (examId, questionId) {
      try {
        const token = await getAuthToken();
        const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
        const res = await fetch(`${API_BASE}/interactions?exam=${encodeURIComponent(examId)}&question=${encodeURIComponent(questionId)}`, { headers });
        if (res.ok) {
          const data = await res.json();
          const countEl = document.getElementById(`reaction-count-${questionId}`);
          const tooltipEl = document.getElementById(`reaction-tooltip-${questionId}`);
          const commentCount = document.getElementById(`comment-count-${questionId}`);

          if (countEl) {
            let total = 0;
            let tooltipHtml = '';
            let iconsHtml = '';

            const sortedReactions = Object.entries(data.reactions).sort((a, b) => b[1] - a[1]);
            for (const [rType, count] of sortedReactions) {
              total += count;
              tooltipHtml += `<div class="rt-row"><span>${reactionEmojis[rType] || rType}</span> <strong>${count}</strong></div>`;
            }

            const topReactions = sortedReactions.slice(0, 3);
            if (topReactions.length > 0) {
              topReactions.forEach(([rType, _], idx) => {
                const iconData = reactionIconsData[rType];
                if (iconData) {
                  iconsHtml += `<span class="q-stats-icon" style="background:${iconData.bg}; z-index:${3 - idx};"><i class="fa-solid ${iconData.icon}"></i></span>`;
                }
              });
            } else {
              iconsHtml = `<span class="q-stats-icon" style="background:#e5e7eb; color:#9ca3af; z-index:1;"><i class="fa-solid fa-thumbs-up"></i></span>`;
            }

            countEl.textContent = total;

            const iconsContainer = document.getElementById(`reaction-icons-${questionId}`);
            if (iconsContainer) {
              iconsContainer.innerHTML = iconsHtml;
            }

            if (tooltipEl) {
              tooltipEl.innerHTML = total > 0 ? tooltipHtml : 'No reactions yet';
            }
          }
          if (commentCount) commentCount.textContent = `${data.comments.length} comments`;

          const card = document.getElementById(`question-card-${questionId}`);
          if (card) card.dataset.comments = JSON.stringify(data.comments);

          // Update active button state
          const mainBtn = document.getElementById(`btn-react-${questionId}`);
          const popout = mainBtn ? mainBtn.nextElementSibling : null;
          if (popout && popout.classList.contains('reaction-popout')) {

              b.style.background = 'transparent';
              b.style.boxShadow = 'none';
            });

            if (data.user_reaction) {
              // Highlight the popout button
              const activeClass = data.user_reaction.replace('_', '-');
              const activeBtn = popout.querySelector(`.reaction-btn.${activeClass}`);
              if (activeBtn) {
                activeBtn.style.background = 'rgba(0,0,0,0.1)';

                // Update the main button to match the selection
                if (mainBtn) {
                  mainBtn.innerHTML = activeBtn.innerHTML;
                  mainBtn.style.color = 'inherit'; // or specific color
                  mainBtn.style.flexDirection = 'row';
                  mainBtn.style.gap = '8px';
                  mainBtn.querySelector('i').style.fontSize = '16px';
                  mainBtn.querySelector('span').style.fontSize = '14px';
                }
              }
            } else {
              if (mainBtn) {
                mainBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg> Reaction`;
                mainBtn.style.color = 'inherit';
                mainBtn.style.flexDirection = 'row';
              }
            }
          }
