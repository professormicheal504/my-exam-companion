<!DOCTYPE html>
<html lang="en">
<head>
<script>
  /* Anti-flash: apply saved theme before first paint */
  (function() {
    try {
      var t = localStorage.getItem('mec_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch(e) {}
  })();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic Video Tutorials | My Exam Companion</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../../../components/topbar.css">
  <link rel="stylesheet" href="../../../components/dark-mode.css">
  <link rel="stylesheet" href="../../../components/sidebar.css?v=2">
  
  <style>
    /* ===========================
       RESET & BASE
    =========================== */
    :root {
        --bg-base: #FAFAFA;
        --bg-card: #FFFFFF;
        --text-primary: #1A1A1A;
        --text-secondary: #6B7280;
        --text-muted: #9CA3AF;
        --border: #E5E7EB;
        --primary-color: #2563eb;
    }
    
    [data-theme="dark"] {
        --bg-base: #111827;
        --bg-card: #1F2937;
        --text-primary: #F9FAFB;
        --text-secondary: #9CA3AF;
        --text-muted: #6B7280;
        --border: #374151;
        --primary-color: #3B82F6;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 14px; font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
    body { background: var(--bg-base); color: var(--text-primary); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; outline: none; background: none; }
    img { display: block; max-width: 100%; }

    /* ===========================
       APP SHELL
    =========================== */
    .app { display: flex; min-height: 100vh; overflow-x: hidden; }
    .main-wrapper {
      margin-left: 90px;
      flex: 1; display: flex; flex-direction: column; min-height: 100vh;
      min-width: 0; max-width: calc(100% - 90px); transition: margin-left 0.2s; overflow-x: hidden;
    }

    /* ===========================
       CONTENT AREA
    =========================== */
    .content-area { display: flex; flex: 1; overflow-x: hidden; background: var(--bg-card); }
    .main-content { flex: 1; min-width: 0; width: 100%; overflow-x: hidden; padding-bottom: 40px; }
    .page-container { max-width: 1400px; margin: 0 auto; padding: 0 32px; }

    /* ===========================
       PAGE HEADER & CONTROLS
    =========================== */
    .page-header {
      padding-top: 32px;
      margin-bottom: 24px;
    }
    
    .page-title {
        font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.02em; margin-bottom: 24px;
    }
    
    .controls-row {
      display: flex; align-items: center; margin-bottom: 24px; gap: 16px; flex-wrap: wrap;
    }
    
    .filter-select {
        padding: 10px 16px;
        border: 1px solid var(--border);
        border-radius: 9999px;
        background: var(--bg-card);
        color: var(--text-primary);
        font-size: 14px;
        font-weight: 500;
        outline: none;
        cursor: pointer;
        min-width: 200px;
        transition: all 0.2s;
        appearance: none;
        /* Custom arrow */
        background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%236B7280%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
        background-repeat: no-repeat, repeat;
        background-position: right .7em top 50%, 0 0;
        background-size: .65em auto, 100%;
    }
    
    /* ===========================
       ADVANCED SEARCH & CHIPS
    =========================== */
    .search-container {
        position: relative;
        width: 100%; max-width: 600px;
        margin-bottom: 24px;
    }
    
    .search-input {
        width: 100%; height: 48px; padding: 0 48px 0 20px;
        border: 1px solid var(--border); border-radius: 9999px;
        background: var(--bg-card); color: var(--text-primary); font-size: 15px;
        transition: all 0.2s; outline: none;
    }
    .search-input:focus { border-color: var(--primary-color); box-shadow: 0 0 0 4px rgba(37,99,235,0.1); }
    .search-icon {
        position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
        color: var(--text-muted); pointer-events: none;
    }
    
    .search-suggestions {
        position: absolute; top: 100%; left: 0; right: 0; margin-top: 8px;
        background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
        box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); z-index: 50;
        display: none; flex-direction: column; overflow: hidden;
    }
    .search-suggestions.active { display: flex; }
    
    .suggestion-item {
        padding: 12px 20px; cursor: pointer; transition: background 0.2s;
        display: flex; align-items: center; gap: 12px;
    }
    .suggestion-item:hover { background: var(--bg-base); }
    .suggestion-icon { color: var(--text-muted); }
    .suggestion-text { font-size: 14px; font-weight: 500; color: var(--text-primary); }
    
    .controls-row {
      display: flex; align-items: center; gap: 16px; margin-bottom: 32px; flex-wrap: wrap;
    }
    
    .filter-select {
        padding: 10px 16px;
        border: 1px solid var(--border);
        border-radius: 9999px;
        background: var(--bg-card);
        color: var(--text-primary);
        font-size: 14px;
        font-weight: 500;
        outline: none;
        cursor: pointer;
        min-width: 200px;
        transition: all 0.2s;
        appearance: none;
        /* Custom arrow */
        background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%236B7280%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
        background-repeat: no-repeat, repeat;
        background-position: right .7em top 50%, 0 0;
        background-size: .65em auto, 100%;
    }
    
    .filter-select:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    
    .controls-row span {
        color: var(--text-muted); font-size: 14px; font-weight: 500;
    }

    /* ===========================
       PAGINATION
    =========================== */
    .pagination-container {
        display: flex; justify-content: center; align-items: center; gap: 8px;
        margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border);
    }
    .page-btn {
        width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
        border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--text-secondary);
        background: transparent; border: 1px solid transparent; cursor: pointer; transition: all 0.2s;
    }
    .page-btn:hover:not(:disabled) { background: var(--bg-base); color: var(--text-primary); }
    .page-btn.active { background: var(--primary-color); color: #fff; }
    .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .page-ellipsis { color: var(--text-muted); }

    /* ===========================
       VIDEO GRID
    =========================== */
    .video-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 28px;
    }
    .video-card {
      display: flex; flex-direction: column; gap: 12px; cursor: pointer;
    }
    .video-thumb-container {
      position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9;
      background: var(--bg-base); border: 1px solid var(--border);
    }
    .video-thumb {
      width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .video-card:hover .video-thumb { transform: scale(1.03); }
    
    .play-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.1);
      display: flex; align-items: center; justify-content: center; opacity: 0;
      transition: all 0.3s;
    }
    .video-card:hover .play-overlay { opacity: 1; background: rgba(0,0,0,0.25); }
    .play-button {
      width: 48px; height: 48px; border-radius: 50%; background: var(--primary-color); color: #fff;
      display: flex; align-items: center; justify-content: center;
      transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .video-card:hover .play-button { transform: scale(1); }
    
    .video-info { display: flex; flex-direction: column; gap: 6px; }
    .video-title {
      font-size: 15px; font-weight: 700; color: var(--text-primary); line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      transition: color 0.2s;
    }
    .video-card:hover .video-title { color: var(--primary-color); }
    .video-meta {
      font-size: 13px; font-weight: 500; color: var(--text-secondary); display: flex; align-items: center; gap: 6px;
    }

    .loading-state {
        grid-column: 1 / -1;
        padding: 40px;
        text-align: center;
        color: var(--text-secondary);
        font-weight: 500;
    }
    
    /* ===========================
       VIDEO MODAL (POPUP)
    =========================== */
    .video-modal-overlay {
        position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); z-index: 100;
        display: none; align-items: center; justify-content: center; flex-direction: column; gap: 20px;
        opacity: 0; transition: opacity 0.3s ease;
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .video-modal-overlay.active {
        display: flex; opacity: 1;
    }
    
    .video-modal-content {
        width: 90%; max-width: 1000px; position: relative;
        aspect-ratio: 16/9; background: #000; border-radius: 16px; overflow: hidden;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.1);
        transform: scale(0.95); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .video-modal-overlay.active .video-modal-content {
        transform: scale(1);
    }
    
    .video-modal-content iframe {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
    }

    .modal-actions {
        display: flex; align-items: center; justify-content: space-between;
        width: 90%; max-width: 1000px; padding: 0 10px;
    }
    
    .modal-btn {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 12px 24px; border-radius: 999px;
        font-size: 15px; font-weight: 600; cursor: pointer;
        transition: all 0.2s ease; border: none; outline: none;
    }
    
    .download-btn {
        background: linear-gradient(135deg, #2563eb, #3b82f6); color: white;
        box-shadow: 0 4px 14px 0 rgba(37, 99, 235, 0.39);
    }
    .download-btn:hover {
        transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }
    
    .modal-close-btn {
        background: rgba(255,255,255,0.1); color: white;
    }
    .modal-close-btn:hover {
        background: rgba(255,255,255,0.2);
    }

    /* ===========================
       RESPONSIVE
    =========================== */
    @media (max-width: 768px) {
      .page-container { padding: 0 20px; }
      .video-grid { gap: 20px; }
      .controls-row { flex-direction: column; align-items: stretch; }
      .filter-select { width: 100%; }
      .controls-row span { display: none; }
    }
    @media (max-width: 600px) {
      .main-wrapper { margin-left: 0; max-width: 100%; }
      .page-container { padding: 0 16px; }
      .page-header { padding-top: 24px; margin-bottom: 16px; }
      .video-grid { grid-template-columns: 1fr; gap: 24px; }
      .video-title { font-size: 16px; }
      .video-modal-content { width: 100%; border-radius: 0; }
      .modal-close-btn { top: 16px; right: 16px; background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 99px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <app-sidebar data-base="../../../"></app-sidebar>
    <div class="main-wrapper">

      <!-- TOPBAR -->
      <app-topbar data-base="../../../"></app-topbar>

      <!-- CONTENT -->
      <div class="content-area">
        <main class="main-content">
          <div class="page-container">
            
            <div class="page-header">
                <h1 class="page-title">Topic Video Tutorials</h1>
                
                <!-- Advanced Search -->
                <div class="search-container">
                    <input type="text" id="advanced-search" class="search-input" placeholder="Search subjects or topics..." autocomplete="off">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    
                    <div id="search-suggestions" class="search-suggestions">
                        <!-- Suggestions injected here -->
                    </div>
                </div>
                
                <!-- Filter Dropdowns -->
                <div class="controls-row">
                    <select id="subject-filter" class="filter-select">
                        <option value="all">All Subjects</option>
                    </select>
                    <span>&rarr;</span>
                    <select id="topic-filter" class="filter-select">
                        <option value="all">All Topics</option>
                    </select>
                </div>
                
            </div>

            <div id="video-grid" class="video-grid">
                <div class="loading-state">Loading curated masterclasses...</div>
                <!-- Video Cards injected here -->
            </div>
            
            <!-- Pagination -->
            <div id="pagination-container" class="pagination-container" style="display: none;">
                <!-- Pagination buttons injected here -->
            </div>
            
          </div><!-- end page-container -->
        </main>
      </div>
    </div>
  </div>
  
  <!-- Video Modal Popup -->
  <div class="video-modal-overlay" id="video-modal">
      <div class="video-modal-content">
          <iframe id="modal-iframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
      <div class="modal-actions">
          <button class="modal-btn download-btn" id="modal-download-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              Download Video
          </button>
          <button class="modal-btn modal-close-btn" id="modal-close-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              Close
          </button>
      </div>
  </div>

  <!-- Supabase Core Component -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../../../components/supabase.js"></script>
  
  <script src="../../../components/topbar.js"></script>
  <script src="../../../components/nav.js"></script>
  <script src="../../../components/sidebar.js?v=6"></script>
  
  <script src="topic_video.js"></script>
</body>
</html>
