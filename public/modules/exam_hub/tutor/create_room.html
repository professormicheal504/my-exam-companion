<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    /* Anti-flash: apply saved theme before first paint */
    (function() {
      try {
        var t = localStorage.getItem('mec_theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Create Room - Exam Companion</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../components/topbar.css?v=13">
  <link rel="stylesheet" href="../../../components/dark-mode.css">
  <link rel="stylesheet" href="../../../components/sidebar.css?v=23">
  
  <style>
    /* ---- Reset & Global ---- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
    }
    body {
      background: var(--bg-base);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      outline: none;
      background: none;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    
    /* ==============================
       APP SHELL & LAYOUT
    ============================== */
    .app {
      display: flex;
      min-height: 100vh;
    }
    .main-wrapper {
      margin-left: 90px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .content-area {
      display: flex;
      flex: 1;
    }
    .main-content {
      flex: 1;
      padding: 32px 24px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    /* Tablet/Mobile Adjustments */
    @media (max-width: 768px) {
      .main-wrapper { margin-left: 80px; }
    }
    @media (max-width: 600px) {
      .main-wrapper { margin-left: 0; }
    }

    /* ==============================
       PAGE HEADER
    ============================== */
    .page-header {
      margin-bottom: 32px;
    }
    .page-header__title {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .page-header__desc {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* ==============================
       FORM CARD & SECTIONS
    ============================== */
    .setup-card {
      background: var(--bg-card);
      border: 1px solid var(--border, #ebebeb);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }
    [data-theme="dark"] .setup-card {
      border-color: #333;
    }

    .form-section {
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border, #ebebeb);
    }
    [data-theme="dark"] .form-section {
      border-color: #333;
    }
    .form-section:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title span {
      background: rgba(37, 99, 235, 0.1);
      color: #2563eb;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 13px;
    }
    [data-theme="dark"] .section-title span {
      background: rgba(59, 130, 246, 0.15) !important;
      color: var(--primary-dk, #60a5fa) !important;
    }

    /* Form Fields */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-group.full-width {
      grid-column: 1 / -1;
    }
    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border, #ebebeb);
      border-radius: 10px;
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }
    [data-theme="dark"] .form-input, [data-theme="dark"] .form-select, [data-theme="dark"] .form-textarea {
      border-color: #444;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      background-color: var(--bg-card);
    }
    
    .form-select {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20width%3D%2220%22%20height%3D%2220%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Cpath%20d%3D%22M5%208l5%205%205-5%22%20stroke%3D%22%236B7280%22%20stroke-width%3D%222%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      padding-right: 40px;
    }

    /* Tags Input (Subjects) */
    .input-with-btn {
      display: flex;
      gap: 12px;
    }
    .btn-add {
      background: #f1f5f9;
      color: #0f172a;
      border: 1px solid var(--border, #ebebeb);
      padding: 0 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
    }
    [data-theme="dark"] .btn-add {
      background: #334155;
      color: #f8fafc;
      border-color: #444;
    }
    .btn-add:hover {
      background: #e2e8f0;
    }
    [data-theme="dark"] .btn-add:hover {
      background: #475569;
    }
    
    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .tag {
      background: rgba(37, 99, 235, 0.1);
      color: #2563eb;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    [data-theme="dark"] .tag {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
    }
    .tag button {
      color: inherit;
      opacity: 0.7;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tag button:hover {
      opacity: 1;
    }

    /* Toggle Switch */
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border: 1px solid var(--border, #ebebeb);
      border-radius: 12px;
      background: var(--bg-base);
      margin-bottom: 16px;
    }
    [data-theme="dark"] .setting-row {
      border-color: #444;
    }
    .setting-info h4 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .setting-info p {
      font-size: 13px;
      color: var(--text-muted);
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e1;
      transition: .3s;
      border-radius: 24px;
    }
    [data-theme="dark"] .slider {
      background-color: #475569;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #2563eb;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* Submit Area */
    .submit-area {
      margin-top: 32px;
      display: flex;
      justify-content: flex-end;
      gap: 16px;
    }
    .btn-cancel {
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      background: var(--bg-base);
      border: 1px solid var(--border, #ebebeb);
      transition: all 0.2s ease;
    }
    [data-theme="dark"] .btn-cancel {
      border-color: #444;
    }
    .btn-cancel:hover {
      background: var(--bg-card);
      border-color: #cbd5e1;
    }
    
    .btn-save {
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 32px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }
    .btn-save:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
    }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .setup-card { padding: 24px; }
      .submit-area { flex-direction: column-reverse; }
      .submit-area button { width: 100%; justify-content: center; }
    }
  </style>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CHG6831RHH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-CHG6831RHH');
  </script>
</head>
<body>

  <div class="app">
    <!-- LEFT SIDEBAR -->
    <app-sidebar data-base="/"></app-sidebar>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
      
      <!-- TOP BAR -->
      <app-topbar data-base="/"></app-topbar>

      <!-- CONTENT AREA -->
      <main class="content-area">
        <section class="main-content">
          
          <div class="page-header">
            <h1 class="page-header__title">Create New Room</h1>
            <p class="page-header__desc">Set up a new virtual classroom and configure its settings.</p>
          </div>

          <div class="setup-card">
            
            <!-- Section 1: Room Details & Subjects -->
            <div class="form-section">
              <h3 class="section-title"><span>1</span> Room Details</h3>
              <div class="form-grid">
                
                <div class="form-group full-width">
                  <label>Room Name</label>
                  <input type="text" class="form-input" placeholder="e.g. Mathematics 101 - JAMB Prep">
                </div>

                <div class="form-group full-width">
                  <label>Description</label>
                  <textarea class="form-textarea" rows="3" placeholder="Briefly describe the purpose of this room..."></textarea>
                </div>

                <div class="form-group full-width">
                  <label>Subjects</label>
                  <div class="input-with-btn">
                    <input type="text" class="form-input" placeholder="Type a subject and click Add">
                    <button type="button" class="btn-add">Add</button>
                  </div>
                  <div class="tags-container">
                    <span class="tag">
                      Mathematics
                      <button><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
                    </span>
                    <span class="tag">
                      English Language
                      <button><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
                    </span>
                  </div>
                </div>

              </div>
            </div>

            <!-- Section 2: Schedule & Timing -->
            <div class="form-section">
              <h3 class="section-title"><span>2</span> Schedule & Timing</h3>
              <div class="form-grid">
                
                <div class="form-group">
                  <label>Start Date / Time</label>
                  <input type="datetime-local" class="form-input">
                </div>

                <div class="form-group">
                  <label>End Date / Time</label>
                  <input type="datetime-local" class="form-input">
                </div>

                <div class="form-group">
                  <label>Duration (Minutes)</label>
                  <input type="number" class="form-input" placeholder="e.g. 120" min="1">
                </div>

              </div>
            </div>

            <!-- Section 3: Lock Settings -->
            <div class="form-section">
              <h3 class="section-title"><span>3</span> Access Settings</h3>
              
              <div class="form-group" style="margin-bottom: 20px; max-width: 400px;">
                <label>Lock Mode</label>
                <select class="form-select">
                  <option value="manual">Manual Lock (Open/Close Manually)</option>
                  <option value="scheduled">Scheduled (Based on start/end time)</option>
                </select>
              </div>

              <div class="setting-row">
                <div class="setting-info">
                  <h4>Require Room Code / Password</h4>
                  <p>Students will need a password to access the content in this room.</p>
                </div>
                <label class="switch">
                  <input type="checkbox" checked>
                  <span class="slider"></span>
                </label>
              </div>

              <!-- This would be toggled via JS based on the switch above -->
              <div class="form-group" style="max-width: 400px;">
                <label>Room Password</label>
                <input type="text" class="form-input" placeholder="Enter a secure code..." value="MATH101-PREP">
              </div>

            </div>

            <!-- Submit -->
            <div class="submit-area">
              <a href="List_of_rooms.html" class="btn-cancel" style="display:inline-flex; align-items:center; text-decoration:none;">Cancel</a>
              <button class="btn-save" onclick="window.location.href='room_page.html'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                  <polyline points="17 21 17 13 7 13 7 21"></polyline>
                  <polyline points="7 3 7 8 15 8"></polyline>
                </svg>
                Save Room
              </button>
            </div>

          </div>

        </section>
      </main>
      
    </div><!-- end main-wrapper -->
  </div><!-- end app -->

  <script defer src="../../../components/topbar.js?v=4"></script>
  <script defer src="../../../components/nav.js"></script>
  <script defer src="../../../components/sidebar.js?v=20"></script>
</body>
</html>
