<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Setup Tutor Hub â€“ My Exam Companion</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../components/topbar.css">
  <link rel="stylesheet" href="../../../components/sidebar.css?v=4">
  <style>
    /* ---- Reset & Global ---- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-family: 'Inter', sans-serif; background: #f7f7f8; color: #131212; }
    body { min-height: 100vh; overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; outline: none; background: none; }
    
    /* ==============================
       APP SHELL â€” Sidebar Layout
    ============================== */
    .app { display: flex; min-height: 100vh; }
    .main-wrapper { margin-left: 90px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
    @media (max-width: 768px) { .main-wrapper { margin-left: 80px; } }
    @media (max-width: 600px) { .main-wrapper { margin-left: 0; } }

    .content-area { padding: 32px 24px; flex: 1; overflow-y: auto; display: flex; justify-content: center; }

    /* ==============================
       FORM CONTAINER
    ============================== */
    .form-container {
      width: 100%;
      max-width: 800px;
    }

    /* ==============================
       PAGE HEADER
    ============================== */
    .page-header {
      margin-bottom: 24px;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px; color: #6b7280; font-size: 14.5px;
      font-weight: 500; margin-bottom: 24px; transition: color 0.2s;
    }
    .back-link:hover { color: #111827; }

    .page-header__title {
      font-size: 28px; font-weight: 800; color: #111827; margin-bottom: 8px; letter-spacing: -0.5px;
    }
    .page-header__desc {
      font-size: 15px; color: #6b7280; line-height: 1.5; max-width: 650px;
    }

    /* ==============================
       FORM CARD
    ============================== */
    .setup-card {
      background: white; border: 1px solid #e5e7eb; border-radius: 16px;
      padding: 32px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 40px;
    }
    
    .setup-section {
      margin-bottom: 32px; padding-bottom: 32px; border-bottom: 1px solid #f3f4f6;
    }
    .setup-section:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    
    .setup-section__title {
      font-size: 18px; font-weight: 700; color: #111827; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
    }
    .setup-section__title span {
      display: flex; align-items: center; justify-content: center; width: 28px; height: 28px;
      background: #fff0f0; color: #b70c01; border-radius: 50%; font-size: 14px; font-weight: 800;
    }

    .form-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;
    }
    .form-group {
      display: flex; flex-direction: column; gap: 8px;
    }
    .form-group.full-width { grid-column: 1 / -1; }
    
    .form-group label {
      font-size: 14px; font-weight: 600; color: #374151;
    }
    
    .form-control {
      background: #f9fafb; border: 1px solid #d1d5db; border-radius: 10px;
      padding: 12px 16px; font-size: 15px; color: #111827; transition: all 0.2s ease;
      font-family: inherit; outline: none; width: 100%;
    }
    .form-control::placeholder { color: #9ca3af; }

    .form-control:focus {
      border-color: #b70c01;
      box-shadow: 0 0 0 3px rgba(183, 12, 1, 0.1);
      background-color: white;
    }
    
    /* THEME BUTTON (#b70c01) */
    .btn-primary {
      background: #b70c01; color: white; font-size: 16px; font-weight: 700;
      padding: 14px 32px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      transition: all 0.2s ease; border: none; cursor: pointer;
      box-shadow: 0 4px 12px rgba(183, 12, 1, 0.2);
    }
    .btn-primary:hover {
      background: #9a0a01; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(183, 12, 1, 0.3);
    }
    
    .btn-secondary {
      background: white; color: #374151; font-size: 16px; font-weight: 700;
      padding: 14px 32px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      transition: all 0.2s ease; border: 1px solid #d1d5db; cursor: pointer;
    }
    .btn-secondary:hover {
      background: #f9fafb; border-color: #9ca3af; transform: translateY(-2px);
    }
    
    .submit-area {
      display: flex; gap: 16px; margin-top: 32px; justify-content: flex-end;
    }

    /* MOBILE RESPONSIVE */
    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      .content-area { padding: 20px 16px; }
      .setup-card { padding: 20px; }
      .submit-area { flex-direction: column-reverse; gap: 12px; }
      .submit-area .btn-secondary, .submit-area .btn-primary { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- LEFT SIDEBAR -->
    <app-sidebar data-base="../../../" data-active="exam_studio"></app-sidebar>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
      <app-topbar data-base="../../../"></app-topbar>

      <main class="content-area">
        <div class="form-container">
          
          <a href="teacher_entry.html" class="back-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Dashboard
          </a>

          <div class="page-header">
            <h1 class="page-header__title">Create Your Tutor Hub</h1>
            <p class="page-header__desc">Set up your personal space where students can discover you, view your specialties, and take the exclusive courses and exams you publish.</p>
          </div>
          
          <div class="setup-card">
            <form action="teacher_entry.html">
              
              <!-- SECTION 1: General Details -->
              <div class="setup-section">
                <h3 class="setup-section__title"><span>1</span> Hub Identity</h3>
                <div class="form-grid">
                  <div class="form-group">
                    <label for="tutor_name">Display Name</label>
                    <input type="text" id="tutor_name" class="form-control" placeholder="e.g. Dr. Smith" required>
                  </div>
                  
                  <div class="form-group">
                    <label for="hub_name">Hub Name</label>
                    <input type="text" id="hub_name" class="form-control" placeholder="e.g. The Chemistry World" required>
                  </div>
                  
                  <div class="form-group full-width">
                    <label for="hub_bio">Short Bio / Welcome Message</label>
                    <textarea id="hub_bio" class="form-control" rows="3" placeholder="Welcome to my hub! I specialize in making complex topics easy..." required></textarea>
                  </div>
                </div>
              </div>

              <!-- SECTION 2: Specialties -->
              <div class="setup-section">
                <h3 class="setup-section__title"><span>2</span> Your Expertise</h3>
                <div class="form-grid">
                  <div class="form-group">
                    <label for="primary_subject">Primary Subject Focus</label>
                    <select id="primary_subject" class="form-control" required>
                      <option value="" disabled selected>-- Select Subject --</option>
                      <option value="mathematics">Mathematics</option>
                      <option value="english">Use of English</option>
                      <option value="physics">Physics</option>
                      <option value="chemistry">Chemistry</option>
                      <option value="biology">Biology</option>
                      <option value="economics">Economics</option>
                      <option value="government">Government</option>
                    </select>
                  </div>
                  
                  <div class="form-group">
                    <label for="secondary_subject">Secondary Subject Focus</label>
                    <select id="secondary_subject" class="form-control">
                      <option value="" selected>-- Select Subject --</option>
                      <option value="mathematics">Mathematics</option>
                      <option value="english">Use of English</option>
                      <option value="physics">Physics</option>
                      <option value="chemistry">Chemistry</option>
                      <option value="biology">Biology</option>
                      <option value="economics">Economics</option>
                      <option value="government">Government</option>
                    </select>
                  </div>
                </div>
              </div>

              <div class="submit-area">
                <button type="button" class="btn-secondary" onclick="window.location.href='teacher_entry.html'">
                  Cancel
                </button>
                <button type="submit" class="btn-primary">
                  Launch My Hub
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                  </svg>
                </button>
              </div>

            </form>
          </div>
          
        </div>
      </main>
    </div>
  </div>
  
  <script defer src="../../../components/nav.js"></script>
  <script defer src="../../../components/sidebar.js"></script>
  <script defer src="../../../components/topbar.js"></script>
</body>
</html>
