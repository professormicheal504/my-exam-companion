<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Create Exam – My Exam Companion</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../components/topbar.css">
  <link rel="stylesheet" href="../../../components/sidebar.css?v=4">
  <style>
    /* ---- Reset & Global ---- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-family: 'Inter', sans-serif; background: #f7f7f8; color: #131212; }
    body { min-height: 100vh; overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; outline: none; background: none; }
    
    /* ==============================
       APP SHELL — Sidebar Layout
    ============================== */
    .app { display: flex; min-height: 100vh; }
    .main-wrapper { margin-left: 90px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
    @media (max-width: 768px) { .main-wrapper { margin-left: 80px; } }
    @media (max-width: 600px) { .main-wrapper { margin-left: 0; } }

    .content-area { padding: 32px 24px; flex: 1; overflow-y: auto; display: flex; justify-content: center; }

    /* ==============================
       FORM CONTAINER
    ============================== */
    .form-container { width: 100%; max-width: 640px; }
    
    .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: #6b7280; margin-bottom: 24px; }
    .breadcrumb a { color: #2563eb; }
    .breadcrumb a:hover { text-decoration: underline; }

    .page-title { font-size: 24px; font-weight: 800; color: #131212; margin-bottom: 32px; letter-spacing: -0.01em; }

    .form-card { background: white; border-radius: 16px; border: 1px solid #e5e7eb; box-shadow: 0 4px 20px rgba(0,0,0,0.03); padding: 32px; }

    .form-group { margin-bottom: 24px; }
    .form-label { display: block; font-size: 14px; font-weight: 700; color: #374151; margin-bottom: 8px; }
    .form-desc { font-size: 13px; color: #6b7280; margin-bottom: 12px; line-height: 1.4; }
    
    .form-input, .form-select {
      width: 100%; padding: 14px 16px; border: 1px solid #d1d5db; border-radius: 12px;
      font-size: 15px; outline: none; transition: all 0.2s; font-family: inherit;
    }
    .form-input:focus, .form-select:focus { border-color: #2563eb; box-shadow: 0 0 0 4px rgba(183, 12, 1, 0.1); }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    /* ==============================
       ACCESS CONTROL (RADIO CARDS)
    ============================== */
    .access-options { display: flex; flex-direction: column; gap: 12px; }
    .access-card {
      border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px;
      display: flex; gap: 16px; cursor: pointer; transition: all 0.2s;
    }
    .access-card:hover { border-color: #d1d5db; background: #f9fafb; }
    .access-card.selected { border-color: #2563eb; background: #fef2f2; }
    
    .access-card input[type="radio"] { margin-top: 4px; accent-color: #2563eb; transform: scale(1.2); }
    .access-content h4 { font-size: 15px; font-weight: 700; color: #111827; margin-bottom: 4px; }
    .access-content p { font-size: 13.5px; color: #6b7280; line-height: 1.4; }
    
    .conditional-field { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px dashed #e5e7eb; }
    .access-card.selected .conditional-field { display: block; animation: slideDown 0.3s ease; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    /* ==============================
       ACTIONS
    ============================== */
    .form-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px; padding-top: 24px; border-top: 1px solid #e5e7eb; }
    
    .btn-outline {
      padding: 14px 24px; border-radius: 12px; font-size: 15px; font-weight: 600;
      border: 1px solid #e5e7eb; background: white; color: #374151; cursor: pointer; transition: all 0.2s;
    }
    .btn-outline:hover { background: #f9fafb; border-color: #d1d5db; color: #111827; }

    .btn-primary {
      background: #2563eb; color: white; font-size: 15px; font-weight: 700;
      padding: 14px 28px; border-radius: 12px; display: inline-flex; align-items: center; gap: 10px;
      transition: all 0.2s ease; border: none; cursor: pointer; box-shadow: 0 4px 12px rgba(183, 12, 1, 0.2);
    }
    .btn-primary:hover { background: #1d4ed8; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(183, 12, 1, 0.3); }

    @media (max-width: 600px) {
      .form-card { padding: 24px 20px; }
      .grid-2 { grid-template-columns: 1fr; }
      .form-actions { flex-direction: column; }
      .form-actions button { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- LEFT SIDEBAR -->
    <app-sidebar data-base="../../../" data-active="exam_studio"></app-sidebar>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
      <app-topbar data-base="../../../"></app-topbar>

      <main class="content-area">
        
        <div class="form-container">
          <div class="breadcrumb">
            <a href="teacher_entry.html">Your Hubs</a>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
            <a href="hub_manager.html">Science Hub</a>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
            <span>Create Exam</span>
          </div>

          <h1 class="page-title">Set Up a New Exam</h1>

          <div class="form-card">
            <!-- Basic Settings -->
            <div class="form-group">
              <label class="form-label">Exam Title</label>
              <input type="text" class="form-input" placeholder="e.g. End of Term Physics Mock Exam">
            </div>

            <div class="grid-2">
              <div class="form-group">
                <label class="form-label">Duration (Minutes)</label>
                <input type="number" class="form-input" placeholder="e.g. 45">
              </div>
              <div class="form-group">
                <label class="form-label">Passing Score (%)</label>
                <input type="number" class="form-input" placeholder="e.g. 50">
              </div>
            </div>

            <!-- Access Control Section -->
            <div class="form-group" style="margin-top: 32px;">
              <label class="form-label">Exam Access Control</label>
              <p class="form-desc">Choose who can participate in this exam. This helps you restrict the test to specific audiences.</p>
              
              <div class="access-options">
                
                <!-- Option 1: Public -->
                <label class="access-card selected" onclick="selectAccess(this, 'public')">
                  <input type="radio" name="access_type" value="public" checked>
                  <div class="access-content">
                    <h4>Generate for all students (Free for all)</h4>
                    <p>Any student enrolled in this Hub can take this exam without restrictions.</p>
                  </div>
                </label>
                
                <!-- Option 2: Password -->
                <label class="access-card" onclick="selectAccess(this, 'password')">
                  <input type="radio" name="access_type" value="password">
                  <div class="access-content">
                    <h4>Set Password</h4>
                    <p>Students must enter a secret PIN or password to start the exam.</p>
                    
                    <div class="conditional-field" id="field-password">
                      <label style="display:block; font-size: 13px; font-weight: 700; margin-bottom: 6px;">Exam PIN/Password</label>
                      <input type="text" class="form-input" placeholder="e.g. PHYS-2026" onclick="event.stopPropagation()">
                    </div>
                  </div>
                </label>

                <!-- Option 3: Private -->
                <label class="access-card" onclick="selectAccess(this, 'private')">
                  <input type="radio" name="access_type" value="private">
                  <div class="access-content">
                    <h4>Share to particular student (Private)</h4>
                    <p>Only specifically invited students will see and have access to this exam.</p>
                    
                    <div class="conditional-field" id="field-private">
                      <label style="display:block; font-size: 13px; font-weight: 700; margin-bottom: 6px;">Student Emails (Comma separated)</label>
                      <textarea class="form-input" rows="3" placeholder="student1@email.com, student2@email.com..." onclick="event.stopPropagation()"></textarea>
                    </div>
                  </div>
                </label>

              </div>
            </div>

            <div class="form-actions">
              <button class="btn-outline" onclick="window.history.back()">Cancel</button>
              <button class="btn-primary" onclick="window.location.href='question_editor.html'">
                Continue to Questions
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
              </button>
            </div>
          </div>
          
        </div>
        
      </main>
    </div>
  </div>
  
  <script>
    function selectAccess(element, type) {
      // Remove selected class from all cards
      document.querySelectorAll('.access-card').forEach(card => {
        card.classList.remove('selected');
      });
      // Add selected class to clicked card
      element.classList.add('selected');
      // Ensure the radio button is checked
      element.querySelector('input[type="radio"]').checked = true;
    }
  </script>

  <script defer src="../../../components/nav.js"></script>
  <script defer src="../../../components/sidebar.js"></script>
  <script defer src="../../../components/topbar.js"></script>
</body>
</html>
